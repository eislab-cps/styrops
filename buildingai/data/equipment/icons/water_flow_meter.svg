  <g stroke="#9fb4cc" stroke-width="0.4" opacity="0.1">
    <line x1="26" y1="50.4" x2="102" y2="50.4"/>
    <line x1="24" y1="52" x2="104" y2="52"/>
    <line x1="24" y1="77" x2="104" y2="77"/>
    <line x1="26" y1="78.6" x2="102" y2="78.6"/>
  </g>
  <rect x="21" y="53" width="86" height="4" fill="#c6d7ea" opacity="0.06"/>
