  <rect x="44" y="36" width="16" height="14" rx="3" fill="#2c3a47"/>
  <rect x="44" y="36" width="16" height="6" rx="2" fill="#4a5d6e" opacity="0.75"/>
  <path d="M44.6 38.4 A3 3 0 0 1 47 36 H58" fill="none" stroke="#a8c2dc" stroke-width="0.7" opacity="0.3"/>
