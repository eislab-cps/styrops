<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="wfmPipe" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#607484"/>
      <stop offset="18%" stop-color="#a3b8cb"/>
      <stop offset="34%" stop-color="#546878"/>
      <stop offset="64%" stop-color="#242f39"/>
      <stop offset="86%" stop-color="#3d4c59"/>
      <stop offset="100%" stop-color="#1a222b"/>
    </linearGradient>
    <linearGradient id="wfmBody" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#4b5b68"/>
      <stop offset="55%" stop-color="#2d3b46"/>
      <stop offset="100%" stop-color="#18212a"/>
    </linearGradient>
    <linearGradient id="wfmDisplay" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0d1e28"/>
      <stop offset="100%" stop-color="#060f16"/>
    </linearGradient>
    <radialGradient id="wfmao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wfmsheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wfmGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fa8d8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7fa8d8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Left flange -->
  <rect x="4" y="54" width="18" height="20" rx="4" fill="url(#wfmPipe)"/>
  <path d="M4 70 V58 A4 4 0 0 1 8 54 H18" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.24"/>
  <path d="M22 60 V70 A4 4 0 0 1 18 74 H9" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <circle cx="8" cy="58" r="2.5" fill="#101720"/><circle cx="8" cy="58" r="1.5" fill="#3d4d5c"/>
  <circle cx="18" cy="58" r="2.5" fill="#101720"/><circle cx="18" cy="58" r="1.5" fill="#3d4d5c"/>
  <circle cx="8" cy="70" r="2.5" fill="#101720"/><circle cx="8" cy="70" r="1.5" fill="#3d4d5c"/>
  <circle cx="18" cy="70" r="2.5" fill="#101720"/><circle cx="18" cy="70" r="1.5" fill="#3d4d5c"/>
  <!-- Right flange -->
  <rect x="106" y="54" width="18" height="20" rx="4" fill="url(#wfmPipe)"/>
  <path d="M106 70 V58 A4 4 0 0 1 110 54 H120" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.24"/>
  <path d="M124 60 V70 A4 4 0 0 1 120 74 H111" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <circle cx="110" cy="58" r="2.5" fill="#101720"/><circle cx="110" cy="58" r="1.5" fill="#3d4d5c"/>
  <circle cx="120" cy="58" r="2.5" fill="#101720"/><circle cx="120" cy="58" r="1.5" fill="#3d4d5c"/>
  <circle cx="110" cy="70" r="2.5" fill="#101720"/><circle cx="110" cy="70" r="1.5" fill="#3d4d5c"/>
  <circle cx="120" cy="70" r="2.5" fill="#101720"/><circle cx="120" cy="70" r="1.5" fill="#3d4d5c"/>
