  <path d="M48 55 Q54 57 52 64 Q46 64 48 55Z" fill="#3d4d5c" opacity="0.85"/>
  <path d="M57 64 Q55 70 48 68 Q48 62 57 64Z" fill="#334455" opacity="0.8"/>
  <path d="M48 73 Q42 71 44 64 Q50 64 48 73Z" fill="#2b3947" opacity="0.8"/>
  <path d="M39 64 Q41 58 48 60 Q48 66 39 64Z" fill="#455767" opacity="0.85"/>
  <circle cx="48" cy="64" r="3" fill="#2a3845"/>
  <circle cx="47.2" cy="63.2" r="1.4" fill="#a8c2dc" opacity="0.6"/>
  <!-- Counter display -->
  <ellipse cx="86" cy="77" rx="22" ry="5" fill="url(#wfmao)"/>
  <rect x="66" y="50" width="40" height="28" rx="6" fill="url(#wfmGlow)"/>
  <rect x="68" y="52" width="36" height="24" rx="4" fill="url(#wfmDisplay)"/>
  <rect x="68" y="52" width="36" height="24" rx="4" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.55"/>
  <rect x="70" y="54" width="28" height="3" rx="1" fill="#9dc0e2" opacity="0.42"/>
  <text x="71" y="67" font-size="10" fill="#9dc0e2" opacity="0.92" font-family="monospace">0123</text>
  <rect x="70" y="70" width="18" height="2" rx="1" fill="#9dc0e2" opacity="0.32"/>
  <path d="M68 68 L82 52 H92 L72 76 H68 Z" fill="#c6d7ea" opacity="0.06"/>
  <rect x="68" y="52" width="36" height="24" rx="4" fill="none" stroke="#3d5560" stroke-width="0.8" opacity="0.6"/>
  <!-- Flow arrows -->
  <line x1="14" y1="64" x2="26" y2="64" stroke="#88aacc" stroke-width="1.5" opacity="0.5" stroke-dasharray="2,2"/>
  <path d="M23 61 L27 64 L23 67" fill="none" stroke="#88aacc" stroke-width="1.5" opacity="0.5" stroke-linejoin="round"/>
  <line x1="102" y1="64" x2="114" y2="64" stroke="#88aacc" stroke-width="1.5" opacity="0.5" stroke-dasharray="2,2"/>
  <path d="M111 61 L115 64 L111 67" fill="none" stroke="#88aacc" stroke-width="1.5" opacity="0.5" stroke-linejoin="round"/>
</svg>
