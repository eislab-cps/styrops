  <ellipse cx="48" cy="77" rx="20" ry="5" fill="url(#wfmao)"/>
  <rect x="32" y="52" width="32" height="24" rx="4" fill="#141c25"/>
  <path d="M33 53 H63" fill="none" stroke="#8fa8c4" stroke-width="0.6" opacity="0.2"/>
  <rect x="32" y="52" width="32" height="24" rx="4" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.55"/>
