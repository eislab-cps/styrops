  <path d="M20 72 V56 A8 8 0 0 1 28 48 H96" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.22"/>
  <path d="M108 56 V72 A8 8 0 0 1 100 80 H32" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
