  <ellipse cx="95" cy="53" rx="15" ry="3.5" fill="url(#prnao)"/>
  <rect x="82" y="34" width="26" height="18" rx="2" fill="#08131a"/>
  <path d="M83 34.7 L107 34.7" stroke="#04070c" stroke-width="1" opacity="0.65"/>
  <path d="M83 51.3 L107 51.3" stroke="#8fa8c4" stroke-width="0.6" opacity="0.16"/>
