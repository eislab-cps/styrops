  <rect x="80" y="32" width="30" height="50" rx="3" fill="url(#prnsheen)"/>
  <path d="M80.6 74 L80.6 35 Q80.6 32.6 83 32.6 L107 32.6" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.2" stroke-linecap="round"/>
  <path d="M109.4 40 L109.4 79 Q109.4 81.4 107 81.4 L88 81.4" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5" stroke-linecap="round"/>
