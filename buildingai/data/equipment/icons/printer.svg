  <rect x="14" y="26" width="100" height="62" rx="7" fill="url(#prnBody)"/>
  <rect x="14" y="26" width="100" height="62" rx="7" fill="url(#prnsheen)"/>
  <ellipse cx="64" cy="86" rx="48" ry="8" fill="url(#prnao)"/>
  <path d="M14.6 78 L14.6 30.6 Q14.6 26.6 18.6 26.6 L110 26.6" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>
  <path d="M113.4 36 L113.4 83.4 Q113.4 87.4 109.4 87.4 L24 87.4" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5" stroke-linecap="round"/>

