  <rect x="84" y="36" width="18" height="3" rx="1" fill="#9fc2e6" opacity="0.6"/>
  <rect x="84" y="42" width="12" height="2" rx="1" fill="#9fc2e6" opacity="0.4"/>
  <rect x="84" y="47" width="20" height="2" rx="1" fill="#9fc2e6" opacity="0.3"/>
  <path d="M82.6 34.6 L94 34.6 L86 51.4 L82.6 51.4 Z" fill="#dceafa" opacity="0.08"/>
