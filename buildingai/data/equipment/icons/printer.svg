  <ellipse cx="86" cy="63" rx="6" ry="2.4" fill="url(#prnao)"/>
  <ellipse cx="96" cy="63" rx="6" ry="2.4" fill="url(#prnao)"/>
  <ellipse cx="86" cy="71" rx="6" ry="2.4" fill="url(#prnao)"/>
  <ellipse cx="96" cy="71" rx="6" ry="2.4" fill="url(#prnao)"/>
  <g fill="#33434f">
    <rect x="82" y="56" width="8" height="6" rx="2"/><rect x="92" y="56" width="8" height="6" rx="2"/>
    <rect x="82" y="64" width="8" height="6" rx="2"/>
  </g>
  <rect x="92" y="64" width="8" height="6" rx="2" fill="#41556a"/>
  <g stroke="#b6cbe2" stroke-width="0.6" opacity="0.22">
