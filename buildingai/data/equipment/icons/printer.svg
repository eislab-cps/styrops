<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="prnBody" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#3a4b58"/>
      <stop offset="55%" stop-color="#26333e"/>
      <stop offset="100%" stop-color="#18212b"/>
    </linearGradient>
    <linearGradient id="prnPanel" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#2b3844"/>
      <stop offset="100%" stop-color="#1a232d"/>
    </linearGradient>
    <linearGradient id="prnPaper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#e6eef7"/>
      <stop offset="60%" stop-color="#b6c6d6"/>
      <stop offset="100%" stop-color="#8b9dae"/>
    </linearGradient>
    <linearGradient id="prnBloom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb6e6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7fb6e6" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="prnao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prnsheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
  </defs>

