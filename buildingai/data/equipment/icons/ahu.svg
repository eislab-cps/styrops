    <path d="M90.9 36 L90.9 84" stroke="#93aabf" stroke-width="0.5" opacity="0.14"/>
  </g>
  <rect x="75" y="34" width="18" height="52" rx="2" fill="url(#ahuSheen)"/>
  <rect x="75" y="34" width="18" height="52" rx="2" fill="none" stroke="#4b5d6c" stroke-width="0.7"/>

