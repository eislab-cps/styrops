  <rect x="14" y="10" width="14" height="17" rx="2" fill="none" stroke="#3d4e5b" stroke-width="0.8"/>
  <path d="M17.6 11.4 L17.6 25.6" stroke="#9fb6cc" stroke-width="0.9" opacity="0.28"/>
  <path d="M14 18.4 L28 18.4" stroke="#4d6070" stroke-width="1.6"/>
  <path d="M14 17.5 L28 17.5" stroke="#95acc2" stroke-width="0.5" opacity="0.25"/>
  <rect x="100" y="10" width="16" height="17" rx="2" fill="url(#ahuDuct)"/>
  <rect x="100" y="10" width="16" height="17" rx="2" fill="none" stroke="#3d4e5b" stroke-width="0.8"/>
  <path d="M104 11.4 L104 25.6" stroke="#9fb6cc" stroke-width="0.9" opacity="0.24"/>
  <path d="M100 18.4 L116 18.4" stroke="#4d6070" stroke-width="1.6"/>
  <path d="M100 17.5 L116 17.5" stroke="#95acc2" stroke-width="0.5" opacity="0.22"/>

  <!-- main cabinet -->
  <rect x="4" y="24" width="120" height="70" rx="5" fill="url(#ahuBody)"/>
  <rect x="4" y="24" width="120" height="70" rx="5" fill="url(#ahuSheen)"/>
  <!-- brushed sheet-metal grain -->
  <g stroke="#9fb4cc" stroke-width="0.4" opacity="0.1">
    <path d="M6 32 L122 32"/><path d="M6 45 L122 45"/><path d="M6 58 L122 58"/>
    <path d="M6 71 L122 71"/><path d="M6 84 L122 84"/>
  </g>
  <rect x="4" y="26" width="120" height="16" fill="#c6d7ea" opacity="0.06"/>
  <!-- cabinet edge lighting: lit top/left, shadowed bottom/right -->
  <path d="M9 24.6 L119 24.6" stroke="#8fa8c4" stroke-width="0.7" opacity="0.34" stroke-linecap="round"/>
  <path d="M4.7 29 L4.7 89" stroke="#8fa8c4" stroke-width="0.7" opacity="0.2" stroke-linecap="round"/>
  <path d="M123.3 30 L123.3 89 M9 93.4 L119 93.4" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5" stroke-linecap="round"/>
  <rect x="4" y="24" width="120" height="70" rx="5" fill="none" stroke="#5c7183" stroke-width="1" opacity="0.5"/>
  <!-- AO pooling along the cabinet floor -->
  <ellipse cx="64" cy="93" rx="58" ry="7" fill="url(#ahuAo)"/>
  <rect x="4" y="24" width="120" height="4.5" rx="2.4" fill="#4c6070" opacity="0.42"/>

  <!-- section dividers, cut as seams -->
  <g stroke-linecap="round">
    <path d="M36 26 L36 92" stroke="#0a121a" stroke-width="1.6" opacity="0.8"/>
    <path d="M36.9 26 L36.9 92" stroke="#7d94aa" stroke-width="0.5" opacity="0.22"/>
    <path d="M72 26 L72 92" stroke="#0a121a" stroke-width="1.6" opacity="0.8"/>
    <path d="M72.9 26 L72.9 92" stroke="#7d94aa" stroke-width="0.5" opacity="0.2"/>
    <path d="M96 26 L96 92" stroke="#0a121a" stroke-width="1.6" opacity="0.8"/>
    <path d="M96.9 26 L96.9 92" stroke="#7d94aa" stroke-width="0.5" opacity="0.18"/>
  </g>
  <g fill="#7d94aa" opacity="0.45">
    <rect x="8" y="28" width="24" height="2" rx="1"/>
    <rect x="40" y="28" width="28" height="2" rx="1"/>
    <rect x="76" y="28" width="16" height="2" rx="1"/>
    <rect x="100" y="28" width="20" height="2" rx="1"/>
  </g>

  <!-- filter bank, recessed into the cabinet -->
  <rect x="8" y="34" width="24" height="52" rx="2" fill="url(#ahuSection)"/>
  <path d="M9 35 L31 35 M9 35 L9 85" fill="none" stroke="#060a10" stroke-width="1.4" opacity="0.6"/>
  <path d="M9 85.4 L31 85.4 M31.2 35 L31.2 85" fill="none" stroke="#7d94aa" stroke-width="0.6" opacity="0.2"/>
  <g stroke="#31414f" stroke-width="0.8" opacity="0.75">
    <path d="M12 36 L12 84"/><path d="M16 36 L16 84"/><path d="M20 36 L20 84"/><path d="M24 36 L24 84"/><path d="M28 36 L28 84"/>
    <path d="M8 40 L32 40"/><path d="M8 46 L32 46"/><path d="M8 52 L32 52"/><path d="M8 58 L32 58"/>
    <path d="M8 64 L32 64"/><path d="M8 70 L32 70"/><path d="M8 76 L32 76"/><path d="M8 82 L32 82"/>
  </g>
  <rect x="8" y="34" width="24" height="52" rx="2" fill="url(#ahuSheen)"/>
  <rect x="8" y="34" width="24" height="52" rx="2" fill="none" stroke="#4b5d6c" stroke-width="0.7"/>

