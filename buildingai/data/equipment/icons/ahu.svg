    <rect x="101" y="54.6" width="6" height="4" rx="1.2" fill="#0a1017" opacity="0.6"/>
    <rect x="101" y="54" width="6" height="4" rx="1.2" fill="#33475a"/>
    <rect x="101.5" y="54.4" width="5" height="1.4" rx="0.7" fill="#9fb8d0" opacity="0.3"/>
    <rect x="109" y="54.6" width="6" height="4" rx="1.2" fill="#0a1017" opacity="0.6"/>
    <rect x="109" y="54" width="6" height="4" rx="1.2" fill="#33475a"/>
    <rect x="109.5" y="54.4" width="5" height="1.4" rx="0.7" fill="#9fb8d0" opacity="0.26"/>
    <rect x="101" y="61.6" width="6" height="4" rx="1.2" fill="#0a1017" opacity="0.6"/>
    <rect x="101" y="61" width="6" height="4" rx="1.2" fill="#33475a"/>
    <rect x="101.5" y="61.4" width="5" height="1.4" rx="0.7" fill="#9fb8d0" opacity="0.26"/>
    <rect x="109" y="61.6" width="6" height="4" rx="1.2" fill="#0a1017" opacity="0.6"/>
    <rect x="109" y="61" width="6" height="4" rx="1.2" fill="#33475a"/>
    <rect x="109.5" y="61.4" width="5" height="1.4" rx="0.7" fill="#9fb8d0" opacity="0.22"/>
  </g>
  <!-- access door -->
  <rect x="101" y="70" width="17" height="14" rx="1.4" fill="#1d2833"/>
  <rect x="101" y="70" width="17" height="14" rx="1.4" fill="url(#ahuSheen)"/>
  <rect x="101" y="70" width="17" height="14" rx="1.4" fill="none" stroke="#3e4f5d" stroke-width="0.6"/>
  <path d="M103 70.6 L103 83.4" stroke="#0a1017" stroke-width="1" opacity="0.7"/>
  <circle cx="103" cy="77" r="1.5" fill="#4a5e70"/>
  <circle cx="102.5" cy="76.5" r="0.6" fill="#c3d6e9" opacity="0.5"/>
  <!-- status LED, glowing -->
  <circle cx="110" cy="81" r="4" fill="#bfe0ff" opacity="0.14"/>
  <circle cx="110" cy="81" r="2.5" fill="#eaf4ff" opacity="0.85"/>
  <circle cx="109.4" cy="80.4" r="0.9" fill="#ffffff"/>

  <!-- drain pan -->
  <rect x="4" y="92" width="120" height="6" rx="3" fill="#131b24"/>
  <path d="M7 92.6 L121 92.6" stroke="#7d94aa" stroke-width="0.6" opacity="0.22" stroke-linecap="round"/>
  <rect x="58" y="96" width="12" height="8" rx="2" fill="#25303f"/>
  <path d="M59.4 96.6 L59.4 103" stroke="#9fb4cc" stroke-width="0.7" opacity="0.25"/>
  <ellipse cx="64" cy="104" rx="10" ry="2.6" fill="url(#ahuAo)"/>
</svg>
