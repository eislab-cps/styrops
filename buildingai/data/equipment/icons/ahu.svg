  <path d="M76 35 L92 35 M76 35 L76 85" fill="none" stroke="#060a10" stroke-width="1.4" opacity="0.55"/>
  <g stroke-linecap="round">
    <path d="M78 36 L78 84" stroke="#0c141b" stroke-width="1.8"/>
    <path d="M78.9 36 L78.9 84" stroke="#93aabf" stroke-width="0.5" opacity="0.24"/>
    <path d="M82 36 L82 84" stroke="#0c141b" stroke-width="1.8"/>
    <path d="M82.9 36 L82.9 84" stroke="#93aabf" stroke-width="0.5" opacity="0.2"/>
    <path d="M86 36 L86 84" stroke="#0c141b" stroke-width="1.8"/>
    <path d="M86.9 36 L86.9 84" stroke="#93aabf" stroke-width="0.5" opacity="0.17"/>
