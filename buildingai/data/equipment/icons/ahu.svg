  <rect x="99" y="34" width="21" height="52" rx="2" fill="#19212e"/>
  <rect x="99" y="34" width="21" height="52" rx="2" fill="url(#ahuSheen)"/>
  <path d="M100 35 L119 35 M100 35 L100 85" fill="none" stroke="#060a10" stroke-width="1.4" opacity="0.6"/>
  <rect x="99" y="34" width="21" height="52" rx="2" fill="none" stroke="#41525f" stroke-width="0.7"/>
  <ellipse cx="109.5" cy="85" rx="10" ry="3" fill="url(#ahuAo)"/>
  <!-- readout with bloom and glass streak -->
  <rect x="100.4" y="37.4" width="18.2" height="13.2" rx="2.4" fill="#2b6fa8" opacity="0.2"/>
  <rect x="101" y="38" width="17" height="12" rx="2" fill="#132436"/>
  <rect x="103" y="40" width="10" height="2" rx="1" fill="#8fc0e6" opacity="0.75"/>
  <rect x="103" y="44" width="7" height="2" rx="1" fill="#8fc0e6" opacity="0.5"/>
  <path d="M101.4 38.4 L108 38.4 L103.4 49.6 L101.4 49.6 Z" fill="#dcecfb" opacity="0.08"/>
