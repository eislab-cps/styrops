<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ahuBody" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#43545f"/>
      <stop offset="45%" stop-color="#2c3b46"/>
      <stop offset="100%" stop-color="#1b262f"/>
    </linearGradient>
    <linearGradient id="ahuSection" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#2e3e49"/>
      <stop offset="100%" stop-color="#18242c"/>
    </linearGradient>
    <linearGradient id="ahuDuct" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a242d"/>
      <stop offset="28%" stop-color="#3a4b57"/>
      <stop offset="62%" stop-color="#243039"/>
      <stop offset="100%" stop-color="#141c24"/>
    </linearGradient>
    <linearGradient id="ahuBlade" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#4a6478"/>
      <stop offset="55%" stop-color="#2c4152"/>
      <stop offset="100%" stop-color="#1c2b36"/>
    </linearGradient>
    <radialGradient id="ahuHub" cx="0.34" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#8fb0c9"/>
      <stop offset="45%" stop-color="#41586a"/>
      <stop offset="100%" stop-color="#1d2933"/>
    </radialGradient>
    <radialGradient id="ahuThroat" cx="0.36" cy="0.32" r="0.72">
      <stop offset="0%" stop-color="#24333e"/>
      <stop offset="60%" stop-color="#151f27"/>
      <stop offset="100%" stop-color="#0b1116"/>
    </radialGradient>
    <linearGradient id="ahuSheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ahuAo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
