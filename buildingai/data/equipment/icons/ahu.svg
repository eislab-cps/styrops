  <path d="M40 35 L68 35 M40 35 L40 85" fill="none" stroke="#060a10" stroke-width="1.4" opacity="0.55"/>
  <circle cx="54" cy="60" r="22" fill="url(#ahuThroat)"/>
  <circle cx="54" cy="60" r="22" fill="none" stroke="#060a10" stroke-width="1.6" opacity="0.65"/>
  <path d="M38 45 A22 22 0 0 1 68 47" fill="none" stroke="#8fa8c4" stroke-width="0.9" opacity="0.28" stroke-linecap="round"/>
  <g fill="url(#ahuBlade)">
    <path d="M54 38 Q60.5 46 54 54 Q47.5 46 54 38Z"/>
    <path d="M76 60 Q68 66.5 60 60 Q68 53.5 76 60Z"/>
    <path d="M54 82 Q47.5 74 54 66 Q60.5 74 54 82Z"/>
    <path d="M32 60 Q40 53.5 48 60 Q40 66.5 32 60Z"/>
  </g>
  <g fill="none" stroke="#a8c2d8" stroke-width="0.55" opacity="0.35" stroke-linecap="round">
