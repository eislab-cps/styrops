  <ellipse cx="64" cy="111" rx="37" ry="7" fill="url(#iotao)"/>

  <!-- Antenna stubs (behind the housing top edge) -->
  <rect x="42" y="5" width="5" height="14" rx="2.5" fill="url(#iotAnt)"/>
  <rect x="42" y="3" width="5" height="5" rx="2.5" fill="#43596b"/>
  <path d="M43.3 6 L43.3 17" stroke="#8fa8c4" stroke-width="0.6" opacity="0.26" stroke-linecap="round"/>
  <rect x="56" y="2" width="5" height="17" rx="2.5" fill="url(#iotAnt)"/>
  <rect x="56" y="0.5" width="5" height="5" rx="2.5" fill="#43596b"/>
  <path d="M57.3 3.5 L57.3 17" stroke="#8fa8c4" stroke-width="0.6" opacity="0.26" stroke-linecap="round"/>
