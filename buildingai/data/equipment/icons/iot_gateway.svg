  <circle cx="62" cy="32" r="3.4" fill="#0c131a"/><circle cx="62" cy="32" r="2.1" fill="#dcebff" opacity="0.36"/>
  <circle cx="72" cy="32" r="3.4" fill="#0c131a"/><circle cx="72" cy="32" r="2.1" fill="#dcebff" opacity="0.28"/>
  <circle cx="82" cy="32" r="3.4" fill="#0c131a"/><circle cx="82" cy="32" r="2.1" fill="#dcebff" opacity="0.2"/>

