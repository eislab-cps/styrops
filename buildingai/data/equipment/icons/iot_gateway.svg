<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="iotBody" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#374855"/>
      <stop offset="55%" stop-color="#26333e"/>
      <stop offset="100%" stop-color="#18212b"/>
    </linearGradient>
    <linearGradient id="iotRail" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#2b3444"/>
      <stop offset="100%" stop-color="#151b26"/>
    </linearGradient>
    <linearGradient id="iotAnt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a5c6e"/>
      <stop offset="45%" stop-color="#2a3845"/>
      <stop offset="100%" stop-color="#161f28"/>
    </linearGradient>
    <linearGradient id="iotLedBloom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#cfe4ff" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="iotao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iotsheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- DIN clip rail behind the housing -->
