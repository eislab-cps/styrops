  <circle cx="50" cy="63.5" r="2" fill="#0a1017"/><circle cx="50" cy="63.5" r="1.2" fill="#e8f2ff" opacity="0.55"/>
  <circle cx="66" cy="63.5" r="2" fill="#0a1017"/><circle cx="66" cy="63.5" r="1.2" fill="#e8f2ff" opacity="0.3"/>
  <circle cx="82" cy="63.5" r="2" fill="#0a1017"/><circle cx="82" cy="63.5" r="1.2" fill="#e8f2ff" opacity="0.3"/>

