<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="hsBody" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#45566a"/>
      <stop offset="55%" stop-color="#2c3945"/>
      <stop offset="100%" stop-color="#1a222b"/>
    </linearGradient>
    <linearGradient id="hsPCB" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1e3826"/>
      <stop offset="100%" stop-color="#0d1b12"/>
    </linearGradient>
    <linearGradient id="hsDrop" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#5f8ba8"/>
      <stop offset="55%" stop-color="#24404f"/>
      <stop offset="100%" stop-color="#132430"/>
    </linearGradient>
    <radialGradient id="hsao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hsglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7de0a0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7de0a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hsled" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#dceaff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#dceaff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hssheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hsclip"><rect x="18" y="14" width="88" height="90" rx="8"/></clipPath>
  </defs>
  <!-- Cable -->
  <path d="M64 108 Q64 116 56 120" fill="none" stroke="#101821" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M64 108 Q64 116 56 120" fill="none" stroke="#31404f" stroke-width="2" stroke-linecap="round"/>
  <path d="M63.2 108.4 Q63.2 115.4 56.2 118.9" fill="none" stroke="#c6d7ea" stroke-width="0.6" stroke-linecap="round" opacity="0.2"/>
  <!-- Main housing -->
  <rect x="18" y="14" width="88" height="90" rx="8" fill="url(#hsBody)"/>
  <g clip-path="url(#hsclip)">
    <rect x="18" y="14" width="88" height="90" fill="url(#hssheen)"/>
    <ellipse cx="62" cy="104" rx="46" ry="10" fill="url(#hsao)"/>
    <!-- shell seam -->
    <path d="M18 99.4 H106" stroke="#0b1118" stroke-width="0.7" opacity="0.5"/>
    <path d="M18 100.2 H106" stroke="#8fa8c4" stroke-width="0.5" opacity="0.1"/>
  </g>
  <path d="M18.5 32 L18.5 22.5 A8 8 0 0 1 26.5 14.5 L98 14.5" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>
  <path d="M105.5 84 L105.5 95.5 A8 8 0 0 1 97.5 103.5 L32 103.5" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5" stroke-linecap="round"/>
  <!-- Top vent grille -->
  <ellipse cx="62" cy="39" rx="38" ry="3.6" fill="url(#hsao)"/>
  <rect x="24" y="16" width="76" height="22" rx="5" fill="#161f28"/>
  <rect x="24" y="16" width="76" height="22" rx="5" fill="url(#hssheen)"/>
  <path d="M24.5 21 A5 5 0 0 1 29.5 16.5 L96 16.5" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.2"/>
  <path d="M99.5 32 A5 5 0 0 1 94.5 37.5 L30 37.5" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <!-- Vent slots -->
  <rect x="28" y="20" width="68" height="2" rx="1" fill="#0e151d" opacity="0.9"/>
  <rect x="28" y="22" width="68" height="0.7" rx="0.35" fill="#8fa8c4" opacity="0.13"/>
  <rect x="28" y="24" width="68" height="2" rx="1" fill="#0e151d" opacity="0.9"/>
  <rect x="28" y="26" width="68" height="0.7" rx="0.35" fill="#8fa8c4" opacity="0.13"/>
  <rect x="28" y="28" width="68" height="2" rx="1" fill="#0e151d" opacity="0.9"/>
  <rect x="28" y="30" width="68" height="0.7" rx="0.35" fill="#8fa8c4" opacity="0.13"/>
  <rect x="28" y="32" width="68" height="2" rx="1" fill="#0e151d" opacity="0.9"/>
  <rect x="28" y="34" width="68" height="0.7" rx="0.35" fill="#8fa8c4" opacity="0.13"/>
