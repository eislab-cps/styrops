  <g>
    <circle cx="24" cy="103" r="3" fill="#0d131a"/><circle cx="24" cy="102.7" r="2" fill="#41535f"/><circle cx="23.4" cy="102.2" r="0.7" fill="#bcd0e2" opacity="0.6"/>
    <circle cx="48" cy="103" r="3" fill="#0d131a"/><circle cx="48" cy="102.7" r="2" fill="#41535f"/><circle cx="47.4" cy="102.2" r="0.7" fill="#bcd0e2" opacity="0.55"/>
    <circle cx="80" cy="103" r="3" fill="#0d131a"/><circle cx="80" cy="102.7" r="2" fill="#41535f"/><circle cx="79.4" cy="102.2" r="0.7" fill="#bcd0e2" opacity="0.5"/>
    <circle cx="104" cy="103" r="3" fill="#0d131a"/><circle cx="104" cy="102.7" r="2" fill="#41535f"/><circle cx="103.4" cy="102.2" r="0.7" fill="#bcd0e2" opacity="0.45"/>
