  <circle cx="42" cy="72" r="20" fill="none" stroke="#060a10" stroke-width="1.4" opacity="0.6"/>
  <path d="M28 58.6 A20 20 0 0 1 55.4 59" fill="none" stroke="#8fa8c4" stroke-width="0.9" opacity="0.3" stroke-linecap="round"/>
  <g fill="#3d5464">
