  <rect x="6" y="64" width="14" height="16" rx="3" fill="url(#pumpFlange)"/>
  <path d="M8 64.6 L18 64.6" stroke="#8fa8c4" stroke-width="0.7" opacity="0.32" stroke-linecap="round"/>
  <path d="M8 79.4 L18 79.4" stroke="#060a10" stroke-width="0.9" opacity="0.5" stroke-linecap="round"/>
  <g><circle cx="9" cy="67" r="2" fill="#0d131a"/><circle cx="9" cy="75" r="2" fill="#0d131a"/>
