  <circle cx="42" cy="72" r="6.2" fill="#2e3d4b"/>
  <circle cx="42" cy="72" r="6.2" fill="none" stroke="#0a1017" stroke-width="0.6" opacity="0.6"/>
  <circle cx="40.4" cy="70.4" r="1.6" fill="#dbe9f8" opacity="0.55"/>

