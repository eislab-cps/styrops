      <stop offset="38%" stop-color="#3b4c59"/>
      <stop offset="74%" stop-color="#222e38"/>
      <stop offset="100%" stop-color="#131a21"/>
    </radialGradient>
    <linearGradient id="pumpMotor" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4b5e6d"/>
      <stop offset="42%" stop-color="#31404c"/>
      <stop offset="100%" stop-color="#1a222c"/>
    </linearGradient>
    <radialGradient id="pumpImp" cx="0.36" cy="0.3" r="0.78">
