<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="wlsPad" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#3d4d59"/>
      <stop offset="55%" stop-color="#27343e"/>
      <stop offset="100%" stop-color="#161f28"/>
    </linearGradient>
    <linearGradient id="wlsPin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a4a58"/>
      <stop offset="28%" stop-color="#b6c9db"/>
      <stop offset="55%" stop-color="#5b6f80"/>
      <stop offset="82%" stop-color="#202a34"/>
      <stop offset="100%" stop-color="#394855"/>
    </linearGradient>
    <radialGradient id="wlsao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wlssheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="wlsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dcecff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#dcecff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Cable (behind) -->
  <path d="M104 36 Q104 28 96 22" fill="none" stroke="#10161e" stroke-width="4"/>
  <path d="M104 36 Q104 28 96 22" fill="none" stroke="#33424f" stroke-width="2.5"/>
  <path d="M103 34 Q103.2 27.6 97 22.6" fill="none" stroke="#a8c2dc" stroke-width="0.6" opacity="0.28"/>
  <!-- Cable connector (top right) -->
  <ellipse cx="104" cy="46" rx="16" ry="4" fill="url(#wlsao)"/>
  <rect x="90" y="36" width="28" height="10" rx="3" fill="#1a232d"/>
  <path d="M91 36.8 H117" fill="none" stroke="#8fa8c4" stroke-width="0.6" opacity="0.22"/>
  <rect x="92" y="38" width="8" height="5" rx="1" fill="#2a3845"/>
  <rect x="102" y="38" width="8" height="5" rx="1" fill="#2a3845"/>
  <!-- Probe pins (drawn behind the pad so they bed in) -->
  <g>
    <rect x="16" y="80" width="4" height="22" rx="2" fill="url(#wlsPin)"/>
    <circle cx="18" cy="102" r="3" fill="#3f4f5e"/><circle cx="17.2" cy="101.2" r="1.3" fill="#c6d7ea" opacity="0.55"/>
    <rect x="24" y="80" width="4" height="22" rx="2" fill="url(#wlsPin)"/>
    <circle cx="26" cy="102" r="3" fill="#3f4f5e"/><circle cx="25.2" cy="101.2" r="1.3" fill="#c6d7ea" opacity="0.5"/>
    <rect x="32" y="80" width="4" height="22" rx="2" fill="url(#wlsPin)"/>
    <circle cx="34" cy="102" r="3" fill="#3f4f5e"/><circle cx="33.2" cy="101.2" r="1.3" fill="#c6d7ea" opacity="0.5"/>
    <rect x="90" y="80" width="4" height="22" rx="2" fill="url(#wlsPin)"/>
    <circle cx="92" cy="102" r="3" fill="#3f4f5e"/><circle cx="91.2" cy="101.2" r="1.3" fill="#c6d7ea" opacity="0.5"/>
    <rect x="98" y="80" width="4" height="22" rx="2" fill="url(#wlsPin)"/>
    <circle cx="100" cy="102" r="3" fill="#3f4f5e"/><circle cx="99.2" cy="101.2" r="1.3" fill="#c6d7ea" opacity="0.5"/>
    <rect x="106" y="80" width="4" height="22" rx="2" fill="url(#wlsPin)"/>
    <circle cx="108" cy="102" r="3" fill="#3f4f5e"/><circle cx="107.2" cy="101.2" r="1.3" fill="#c6d7ea" opacity="0.5"/>
  </g>
  <!-- Flat pad body (matte plastic) -->
  <rect x="10" y="44" width="108" height="40" rx="6" fill="url(#wlsPad)"/>
  <rect x="10" y="44" width="108" height="40" rx="6" fill="url(#wlssheen)"/>
  <!-- Occlusion inside the bottom edge -->
  <ellipse cx="64" cy="83" rx="50" ry="7" fill="url(#wlsao)"/>
  <!-- Shell seam -->
  <path d="M10.6 78 H117.4" fill="none" stroke="#0b1119" stroke-width="0.7" opacity="0.4"/>
  <path d="M10.6 78.8 H117.4" fill="none" stroke="#8fa8c4" stroke-width="0.5" opacity="0.12"/>
  <!-- Edge lighting -->
  <path d="M10 76 V50 A6 6 0 0 1 16 44 H106" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.22"/>
  <path d="M118 54 V78 A6 6 0 0 1 112 84 H24" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <!-- Label / display area -->
  <ellipse cx="64" cy="76" rx="32" ry="6" fill="url(#wlsao)"/>
  <rect x="36" y="52" width="56" height="24" rx="3" fill="#141c25"/>
  <path d="M37 52.8 H91" fill="none" stroke="#8fa8c4" stroke-width="0.6" opacity="0.2"/>
  <rect x="36" y="52" width="56" height="24" rx="3" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <!-- Water drop symbol -->
  <path d="M64 57 Q70 63 70 67 A6 6 0 0 1 58 67 Q58 63 64 57Z" fill="#1d3c96" opacity="0.8"/>
  <path d="M64 58 Q69 64 69 67 A5 5 0 0 1 59 67 Q59 64 64 58Z" fill="#3f7ae0" opacity="0.6"/>
  <path d="M62.2 63 Q60.6 65.4 61 67.4" fill="none" stroke="#dcecff" stroke-width="1.2" opacity="0.55" stroke-linecap="round"/>
  <!-- Alarm LED -->
  <circle cx="80" cy="60" r="8" fill="url(#wlsGlow)"/>
  <circle cx="80" cy="60" r="5" fill="#121924"/>
  <circle cx="80" cy="60" r="3.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="80" cy="60" r="2" fill="#ffffff"/>
  <!-- Mounting screws on pad -->
  <circle cx="18" cy="52" r="3" fill="#131a22"/><circle cx="18" cy="52" r="2" fill="#334455"/><circle cx="17.4" cy="51.4" r="0.7" fill="#a8c2dc" opacity="0.5"/>
  <circle cx="110" cy="52" r="3" fill="#131a22"/><circle cx="110" cy="52" r="2" fill="#334455"/><circle cx="109.4" cy="51.4" r="0.7" fill="#a8c2dc" opacity="0.5"/>
  <circle cx="18" cy="76" r="3" fill="#131a22"/><circle cx="18" cy="76" r="2" fill="#334455"/><circle cx="17.4" cy="75.4" r="0.7" fill="#a8c2dc" opacity="0.5"/>
  <circle cx="110" cy="76" r="3" fill="#131a22"/><circle cx="110" cy="76" r="2" fill="#334455"/><circle cx="109.4" cy="75.4" r="0.7" fill="#a8c2dc" opacity="0.5"/>
</svg>
