<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="crPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f515e"/>
      <stop offset="100%" stop-color="#1c262e"/>
    </linearGradient>
    <linearGradient id="crScreen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1c2c46"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <radialGradient id="crao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crsheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Wall mounting bracket -->
  <rect x="14" y="20" width="8" height="88" rx="3" fill="#18222c"/>
  <rect x="14" y="20" width="8" height="4" rx="2" fill="#2a3540"/>
  <rect x="14" y="100" width="8" height="4" rx="2" fill="#2a3540"/>
  <rect x="14.6" y="22" width="1.6" height="84" rx="0.8" fill="#8fa8c4" opacity="0.1"/>
  <!-- Main panel body -->
  <rect x="22" y="14" width="78" height="100" rx="7" fill="url(#crPanel)"/>
  <rect x="22" y="14" width="78" height="100" rx="7" fill="url(#crsheen)"/>
  <!-- Inside-bottom ambient occlusion -->
  <ellipse cx="61" cy="111" rx="37" ry="10" fill="url(#crao)"/>
  <rect x="22" y="14" width="78" height="100" rx="7" fill="none" stroke="#5d707f" stroke-width="1" opacity="0.5"/>
  <!-- Mounting screws -->
  <circle cx="32" cy="22" r="3" fill="#141c26"/><circle cx="32" cy="22" r="2" fill="#3b4d5e"/><line x1="30" y1="22" x2="34" y2="22" stroke="#141c26" stroke-width="0.8"/><line x1="32" y1="20" x2="32" y2="24" stroke="#141c26" stroke-width="0.8"/>
  <circle cx="90" cy="22" r="3" fill="#141c26"/><circle cx="90" cy="22" r="2" fill="#3b4d5e"/><line x1="88" y1="22" x2="92" y2="22" stroke="#141c26" stroke-width="0.8"/><line x1="90" y1="20" x2="90" y2="24" stroke="#141c26" stroke-width="0.8"/>
  <circle cx="32" cy="106" r="3" fill="#141c26"/><circle cx="32" cy="106" r="2" fill="#3b4d5e"/><line x1="30" y1="106" x2="34" y2="106" stroke="#141c26" stroke-width="0.8"/><line x1="32" y1="104" x2="32" y2="108" stroke="#141c26" stroke-width="0.8"/>
  <circle cx="90" cy="106" r="3" fill="#141c26"/><circle cx="90" cy="106" r="2" fill="#3b4d5e"/><line x1="88" y1="106" x2="92" y2="106" stroke="#141c26" stroke-width="0.8"/><line x1="90" y1="104" x2="90" y2="108" stroke="#141c26" stroke-width="0.8"/>
  <!-- Small screen -->
  <ellipse cx="60.5" cy="41.5" rx="32" ry="19" fill="url(#crao)"/>
  <rect x="30.5" y="24.5" width="59" height="33" rx="5" fill="#5f9fd8" opacity="0.07"/>
  <rect x="32" y="26" width="56" height="30" rx="3" fill="url(#crScreen)"/>
  <rect x="32" y="26" width="56" height="30" rx="3" fill="none" stroke="#465a6b" stroke-width="0.8"/>
  <!-- Screen content -->
  <rect x="36" y="31" width="28" height="3" rx="1" fill="#88aacc" opacity="0.65"/>
  <rect x="36" y="37" width="20" height="2" rx="1" fill="#88aacc" opacity="0.42"/>
  <rect x="36" y="43" width="32" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
  <!-- Screen glass reflection -->
  <path d="M33 55 L33 29 A3 3 0 0 1 36 26 L58 26 L37 55Z" fill="#c6d7ea" opacity="0.08"/>
  <!-- Shell seam -->
  <line x1="24" y1="59.4" x2="98" y2="59.4" stroke="#050a10" stroke-width="0.6" opacity="0.45"/>
  <line x1="24" y1="60.1" x2="98" y2="60.1" stroke="#8fa8c4" stroke-width="0.5" opacity="0.12"/>
  <!-- Card slot -->
  <ellipse cx="60" cy="66" rx="32" ry="7" fill="url(#crao)"/>
  <rect x="32" y="62" width="56" height="7" rx="2" fill="#141c26"/>
  <rect x="32" y="62" width="56" height="2.6" rx="1.3" fill="#2a3845" opacity="0.7"/>
  <rect x="32" y="62" width="56" height="7" rx="2" fill="none" stroke="#465a6b" stroke-width="0.7"/>
  <!-- Slot label -->
  <line x1="38" y1="65.4" x2="76" y2="65.4" stroke="#88aacc" stroke-width="0.5" opacity="0.35" stroke-dasharray="3,2"/>
  <!-- LED array -->
  <ellipse cx="60" cy="80.5" rx="32" ry="9" fill="url(#crao)"/>
  <rect x="32" y="75" width="56" height="10" rx="3" fill="#151d28"/>
  <rect x="33" y="75.7" width="54" height="1.5" rx="0.75" fill="#8fa8c4" opacity="0.1"/>
  <circle cx="42" cy="80" r="5.2" fill="#cfe6ff" opacity="0.1"/>
  <circle cx="42" cy="80" r="3" fill="#e8f3ff" opacity="0.85"/><circle cx="41.3" cy="79.3" r="0.8" fill="#ffffff"/>
  <circle cx="52" cy="80" r="3" fill="#e8f3ff" opacity="0.5"/>
  <circle cx="62" cy="80" r="3" fill="#dbe8f5" opacity="0.3"/>
  <circle cx="72" cy="80" r="3" fill="#dbe8f5" opacity="0.3"/>
  <circle cx="80" cy="80" r="3" fill="#dbe8f5" opacity="0.5"/>
  <!-- Antenna symbol -->
  <line x1="60" y1="92" x2="60" y2="100" stroke="#465a6b" stroke-width="1.5"/>
  <path d="M52 96 Q60 88 68 96" fill="none" stroke="#7d92a8" stroke-width="1" opacity="0.7"/>
  <path d="M48 100 Q60 85 72 100" fill="none" stroke="#465a6b" stroke-width="0.8" opacity="0.5"/>
  <!-- Panel seams -->
  <line x1="24" y1="20" x2="98" y2="20" stroke="#465a6b" stroke-width="0.5" opacity="0.5"/>
  <line x1="24" y1="108" x2="98" y2="108" stroke="#050a10" stroke-width="0.6" opacity="0.5"/>
  <!-- Edge lighting: top + left -->
  <path d="M22.6 96 L22.6 21.6 A7 7 0 0 1 29.6 14.6 L86 14.6" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>
  <!-- Edge lighting: bottom + right -->
  <path d="M99.4 40 L99.4 106.4 A7 7 0 0 1 92.4 113.4 L44 113.4" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5" stroke-linecap="round"/>
</svg>
