  <ellipse cx="87" cy="64.5" rx="21" ry="8" fill="url(#bmsao)"/>
  <rect x="70" y="60" width="12" height="8" rx="1" fill="#141c26" stroke="#334455" stroke-width="0.6"/>
  <rect x="84" y="60" width="12" height="8" rx="1" fill="#141c26" stroke="#334455" stroke-width="0.6"/>
  <rect x="98" y="60" width="8" height="8" rx="1" fill="#141c26" stroke="#334455" stroke-width="0.6"/>
