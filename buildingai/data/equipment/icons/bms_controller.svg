  <rect x="20" y="30" width="88" height="50" rx="4" fill="url(#bmssheen)" opacity="0.35"/>
  <!-- Shell seam -->
  <line x1="20" y1="81.6" x2="108" y2="81.6" stroke="#050a10" stroke-width="0.6" opacity="0.45"/>
  <line x1="20" y1="82.3" x2="108" y2="82.3" stroke="#8fa8c4" stroke-width="0.5" opacity="0.12"/>
