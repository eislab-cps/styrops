  <rect x="20" y="14" width="88" height="12" rx="4" fill="#161e2a"/>
  <rect x="21" y="14.8" width="86" height="1.6" rx="0.8" fill="#8fa8c4" opacity="0.1"/>
  <!-- LED status indicators (6 leds) -->
  <circle cx="30" cy="20" r="6" fill="#cfe6ff" opacity="0.09"/>
  <circle cx="30" cy="20" r="3.5" fill="#160c0c"/><circle cx="30" cy="20" r="2.2" fill="#e8f3ff" opacity="0.85"/><circle cx="29.4" cy="19.4" r="0.7" fill="#ffffff"/>
  <circle cx="42" cy="20" r="5.5" fill="#cfe6ff" opacity="0.06"/>
  <circle cx="42" cy="20" r="3.5" fill="#160c0c"/><circle cx="42" cy="20" r="2.2" fill="#e8f3ff" opacity="0.6"/>
  <circle cx="54" cy="20" r="3.5" fill="#160c0c"/><circle cx="54" cy="20" r="2.2" fill="#dbe8f5" opacity="0.5"/>
  <circle cx="66" cy="20" r="3.5" fill="#160c0c"/><circle cx="66" cy="20" r="2.2" fill="#dbe8f5" opacity="0.4"/>
  <circle cx="78" cy="20" r="3.5" fill="#160c0c"/><circle cx="78" cy="20" r="2.2" fill="#dbe8f5" opacity="0.4"/>
  <circle cx="90" cy="20" r="3.5" fill="#160c0c"/><circle cx="90" cy="20" r="2.2" fill="#dbe8f5" opacity="0.3"/>
  <!-- PCB area (visible) -->
  <ellipse cx="64" cy="55" rx="48" ry="29" fill="url(#bmsao)"/>
  <rect x="20" y="30" width="88" height="50" rx="4" fill="url(#bmsPCB)"/>
  <rect x="20" y="30" width="88" height="50" rx="4" fill="none" stroke="#2a4030" stroke-width="0.7"/>
