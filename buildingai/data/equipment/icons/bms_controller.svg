<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bmsBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f414d"/>
      <stop offset="100%" stop-color="#18222c"/>
    </linearGradient>
    <linearGradient id="bmsPCB" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1a2820"/>
      <stop offset="100%" stop-color="#0c1510"/>
    </linearGradient>
    <radialGradient id="bmsao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bmssheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- DIN rail clip bottom -->
  <rect x="16" y="114" width="96" height="10" rx="2" fill="#161e2a"/>
  <rect x="16" y="114" width="20" height="10" rx="2" fill="#2a3040"/>
  <rect x="92" y="114" width="20" height="10" rx="2" fill="#2a3040"/>
  <rect x="16" y="114" width="20" height="2" rx="1" fill="#8fa8c4" opacity="0.1"/>
  <rect x="92" y="114" width="20" height="2" rx="1" fill="#8fa8c4" opacity="0.1"/>
  <!-- Main PLC housing -->
  <rect x="16" y="10" width="96" height="106" rx="6" fill="url(#bmsBody)"/>
  <rect x="16" y="10" width="96" height="106" rx="6" fill="url(#bmssheen)"/>
  <!-- Inside-bottom ambient occlusion -->
  <ellipse cx="64" cy="113" rx="46" ry="10" fill="url(#bmsao)"/>
  <rect x="16" y="10" width="96" height="106" rx="6" fill="none" stroke="#465a6b" stroke-width="1.2" opacity="0.5"/>
  <!-- Top LED row status -->
