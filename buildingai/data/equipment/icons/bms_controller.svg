  <line x1="60" y1="36" x2="60" y2="66" stroke="#2f5c36" stroke-width="0.8"/>
  <line x1="26" y1="50" x2="50" y2="50" stroke="#2f5c36" stroke-width="0.8"/>
  <line x1="70" y1="40" x2="100" y2="40" stroke="#2f5c36" stroke-width="0.8"/>
  <line x1="80" y1="40" x2="80" y2="70" stroke="#2f5c36" stroke-width="0.8"/>
