  <ellipse cx="40" cy="67.5" rx="17" ry="8" fill="url(#bmsao)"/>
  <rect x="26" y="62" width="28" height="10" rx="2" fill="#161e2a"/>
  <rect x="28" y="64" width="4" height="6" rx="1" fill="#3b4d5e"/>
  <rect x="34" y="64" width="4" height="6" rx="1" fill="#3b4d5e"/>
  <rect x="40" y="64" width="4" height="6" rx="1" fill="#3b4d5e"/>
  <rect x="46" y="64" width="4" height="6" rx="1" fill="#3b4d5e"/>
  <rect x="28" y="66" width="4" height="2" rx="0.5" fill="#2f5c36"/>
  <rect x="40" y="66" width="4" height="2" rx="0.5" fill="#2f5c36"/>
