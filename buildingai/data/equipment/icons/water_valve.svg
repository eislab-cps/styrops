<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="wvPipe" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#5f7383"/>
      <stop offset="18%" stop-color="#a3b8cb"/>
      <stop offset="34%" stop-color="#536777"/>
      <stop offset="64%" stop-color="#232e38"/>
      <stop offset="86%" stop-color="#3c4b58"/>
      <stop offset="100%" stop-color="#19212a"/>
    </linearGradient>
    <linearGradient id="wvBody" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#4c5c6a"/>
      <stop offset="55%" stop-color="#2c3a46"/>
      <stop offset="100%" stop-color="#18212a"/>
    </linearGradient>
    <linearGradient id="wvBonnet" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#526475"/>
      <stop offset="55%" stop-color="#334455"/>
      <stop offset="100%" stop-color="#1c252f"/>
    </linearGradient>
    <linearGradient id="wvWheel" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#6b8095"/>
      <stop offset="45%" stop-color="#3b4b5a"/>
      <stop offset="100%" stop-color="#1b232d"/>
    </linearGradient>
    <linearGradient id="wvStem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#33414d"/>
      <stop offset="26%" stop-color="#b0c4d6"/>
      <stop offset="52%" stop-color="#4b5d6d"/>
      <stop offset="80%" stop-color="#1c252e"/>
      <stop offset="100%" stop-color="#35434f"/>
    </linearGradient>
    <radialGradient id="wvao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wvsheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Handwheel rim -->
  <circle cx="64" cy="16" r="18" fill="none" stroke="url(#wvWheel)" stroke-width="4.4"/>
  <path d="M51.3 3.3 A18 18 0 0 1 76.7 3.3" fill="none" stroke="#c6d7ea" stroke-width="1" opacity="0.3"/>
  <path d="M76.7 28.7 A18 18 0 0 1 51.3 28.7" fill="none" stroke="#060a10" stroke-width="1.2" opacity="0.5"/>
  <!-- Handwheel spokes -->
  <g stroke="#131a22" stroke-width="3.2" stroke-linecap="round">
    <line x1="64" y1="16" x2="64" y2="0"/>
    <line x1="64" y1="16" x2="80" y2="22"/>
    <line x1="64" y1="16" x2="74" y2="30"/>
    <line x1="64" y1="16" x2="54" y2="30"/>
    <line x1="64" y1="16" x2="48" y2="22"/>
  </g>
  <g stroke="#3d4d5c" stroke-width="2.2" stroke-linecap="round">
    <line x1="64" y1="15.4" x2="64" y2="0"/>
    <line x1="64" y1="15.4" x2="79.6" y2="21.4"/>
    <line x1="64" y1="15.4" x2="73.6" y2="29.4"/>
    <line x1="64" y1="15.4" x2="54" y2="29.4"/>
    <line x1="64" y1="15.4" x2="48" y2="21.4"/>
  </g>
  <g stroke="#a8c2dc" stroke-width="0.6" opacity="0.24" stroke-linecap="round">
    <line x1="63" y1="14.6" x2="63" y2="1"/>
    <line x1="63.4" y1="14.6" x2="47.6" y2="20.8"/>
  </g>
  <!-- Handwheel centre hub -->
  <circle cx="64" cy="16" r="5.6" fill="#26323d"/>
  <circle cx="64" cy="16" r="3.4" fill="#4a5c6b"/>
  <path d="M61.6 14.2 A3.4 3.4 0 0 1 66.4 13.8" fill="none" stroke="#c6d7ea" stroke-width="0.8" opacity="0.4"/>
  <!-- Valve stem -->
  <rect x="61" y="18" width="6" height="18" rx="2" fill="url(#wvStem)"/>
  <!-- Left pipe flange -->
  <rect x="4" y="58" width="16" height="12" rx="3" fill="url(#wvPipe)"/>
  <path d="M4 67 V61 A3 3 0 0 1 7 58 H17" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.24"/>
  <path d="M20 63 V67 A3 3 0 0 1 17 70 H8" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <circle cx="7" cy="61" r="2" fill="#101720"/><circle cx="7" cy="67" r="2" fill="#101720"/>
  <circle cx="17" cy="61" r="2" fill="#101720"/><circle cx="17" cy="67" r="2" fill="#101720"/>
  <!-- Right pipe flange -->
  <rect x="108" y="58" width="16" height="12" rx="3" fill="url(#wvPipe)"/>
  <path d="M108 67 V61 A3 3 0 0 1 111 58 H121" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.24"/>
  <path d="M124 63 V67 A3 3 0 0 1 121 70 H112" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <circle cx="111" cy="61" r="2" fill="#101720"/><circle cx="111" cy="67" r="2" fill="#101720"/>
  <circle cx="121" cy="61" r="2" fill="#101720"/><circle cx="121" cy="67" r="2" fill="#101720"/>
  <!-- Main pipe body -->
  <rect x="16" y="58" width="96" height="12" rx="2" fill="url(#wvPipe)"/>
  <rect x="18" y="59.4" width="92" height="1.4" rx="0.7" fill="#dcecff" opacity="0.35"/>
  <g stroke="#9fb4cc" stroke-width="0.4" opacity="0.1">
    <line x1="18" y1="62.6" x2="110" y2="62.6"/>
    <line x1="18" y1="64.4" x2="110" y2="64.4"/>
  </g>
  <path d="M17 69.4 H111" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <!-- Flow arrow -->
  <line x1="24" y1="64" x2="40" y2="64" stroke="#88aacc" stroke-width="1.5" opacity="0.5" stroke-dasharray="3,2"/>
  <path d="M37 61 L41 64 L37 67" fill="none" stroke="#88aacc" stroke-width="1.5" opacity="0.5" stroke-linejoin="round"/>
  <!-- Flow direction label area -->
  <rect x="82" y="60" width="22" height="8" rx="2" fill="#101720" opacity="0.55"/>
  <line x1="84" y1="64" x2="96" y2="64" stroke="#88aacc" stroke-width="1" opacity="0.4"/>
  <path d="M93 61 L97 64 L93 67" fill="none" stroke="#88aacc" stroke-width="1" opacity="0.4"/>
  <!-- Valve bonnet (upper part) -->
  <ellipse cx="64" cy="52" rx="13" ry="4" fill="url(#wvao)"/>
  <rect x="54" y="34" width="20" height="18" rx="3" fill="url(#wvBonnet)"/>
  <rect x="54" y="34" width="20" height="18" rx="3" fill="url(#wvsheen)"/>
  <path d="M54 47 V37 A3 3 0 0 1 57 34 H71" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.24"/>
  <path d="M74 40 V49 A3 3 0 0 1 71 52 H60" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <!-- Packing gland nuts on bonnet -->
  <rect x="52" y="44" width="8" height="5" rx="1" fill="#2a3845" stroke="#0d131a" stroke-width="0.6"/>
  <path d="M52.6 44.7 H59.4" fill="none" stroke="#a8c2dc" stroke-width="0.5" opacity="0.3"/>
  <rect x="68" y="44" width="8" height="5" rx="1" fill="#2a3845" stroke="#0d131a" stroke-width="0.6"/>
  <path d="M68.6 44.7 H75.4" fill="none" stroke="#a8c2dc" stroke-width="0.5" opacity="0.3"/>
  <!-- Valve body (cast metal) -->
  <ellipse cx="64" cy="50" rx="18" ry="5" fill="url(#wvao)"/>
  <rect x="48" y="50" width="32" height="28" rx="4" fill="url(#wvBody)"/>
  <rect x="48" y="50" width="32" height="28" rx="4" fill="url(#wvsheen)"/>
  <g stroke="#9fb4cc" stroke-width="0.4" opacity="0.1">
    <line x1="50" y1="53" x2="78" y2="53"/>
    <line x1="50" y1="55.4" x2="78" y2="55.4"/>
    <line x1="50" y1="73" x2="78" y2="73"/>
  </g>
  <rect x="49" y="57" width="30" height="3.4" fill="#c6d7ea" opacity="0.06"/>
  <ellipse cx="64" cy="77" rx="15" ry="4" fill="url(#wvao)"/>
  <!-- Valve body seam line -->
  <path d="M48 64 H80" fill="none" stroke="#060a10" stroke-width="1.2" opacity="0.45"/>
  <path d="M48 65 H80" fill="none" stroke="#8fa8c4" stroke-width="0.6" opacity="0.16"/>
  <!-- Body edge lighting -->
  <path d="M48 74 V54 A4 4 0 0 1 52 50 H76" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.24"/>
  <path d="M80 56 V74 A4 4 0 0 1 76 78 H54" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
</svg>
