<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="dlHousing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#41525e"/>
      <stop offset="55%" stop-color="#2c3945"/>
      <stop offset="100%" stop-color="#1a232b"/>
    </linearGradient>
    <linearGradient id="dlFace" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#4d5f70"/>
      <stop offset="55%" stop-color="#374857"/>
      <stop offset="100%" stop-color="#232f3a"/>
    </linearGradient>
    <linearGradient id="dlBolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8499ae"/>
      <stop offset="100%" stop-color="#31404d"/>
    </linearGradient>
    <radialGradient id="dlao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dlglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#dceaff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#dceaff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dlsheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="dlclip"><rect x="24" y="10" width="72" height="108" rx="8"/></clipPath>
    <clipPath id="dlclipF"><rect x="30" y="16" width="60" height="96" rx="5"/></clipPath>
  </defs>
  <!-- Main housing -->
  <rect x="24" y="10" width="72" height="108" rx="8" fill="url(#dlHousing)"/>
