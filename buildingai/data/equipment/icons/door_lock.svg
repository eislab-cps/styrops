  <rect x="40" y="80" width="12" height="8" rx="2" fill="#2a3a45"/><rect x="40" y="80" width="12" height="3" rx="1.5" fill="#c6d7ea" opacity="0.07"/>
  <rect x="54" y="80" width="12" height="8" rx="2" fill="#2a3a45"/><rect x="54" y="80" width="12" height="3" rx="1.5" fill="#c6d7ea" opacity="0.07"/>
  <rect x="68" y="80" width="12" height="8" rx="2" fill="#2a3a45"/><rect x="68" y="80" width="12" height="3" rx="1.5" fill="#c6d7ea" opacity="0.07"/>
