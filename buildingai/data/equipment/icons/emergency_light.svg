    <circle cx="27" cy="57" r="2" fill="#ffffff" opacity="0.85"/>
    <path d="M8 51.4 H26 L16 56 H8Z" fill="#ffffff" opacity="0.14"/>
    <ellipse cx="20" cy="65.5" rx="13" ry="3" fill="url(#elao)"/>
  </g>
  <path d="M9 51.4 A3 3 0 0 1 11.4 50.4 L27 50.4" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.35"/>
  <circle cx="11.4" cy="52.2" r="0.9" fill="#ffffff" opacity="0.8"/>
  <!-- Right lamp head -->
  <ellipse cx="108" cy="66" rx="15" ry="3.4" fill="url(#elao)"/>
  <rect x="94" y="48" width="28" height="18" rx="5" fill="url(#elHead)"/>
  <path d="M94.5 53 A5 5 0 0 1 99.5 48.5 L118 48.5" fill="none" stroke="#a9c0d8" stroke-width="0.7" opacity="0.22"/>
  <path d="M121.5 60 A5 5 0 0 1 116.5 65.5 L100 65.5" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <!-- Right lens (glass) -->
  <rect x="96" y="50" width="24" height="14" rx="3" fill="#101a22"/>
  <rect x="96" y="50" width="24" height="14" rx="3" fill="url(#elLens)"/>
  <g clip-path="url(#elclipR)">
    <ellipse cx="108" cy="57" rx="13" ry="8" fill="url(#elglow)"/>
    <circle cx="101" cy="57" r="2" fill="#ffffff" opacity="0.95"/>
    <circle cx="108" cy="57" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="115" cy="57" r="2" fill="#ffffff" opacity="0.85"/>
    <path d="M96 51.4 H114 L104 56 H96Z" fill="#ffffff" opacity="0.13"/>
    <ellipse cx="108" cy="65.5" rx="13" ry="3" fill="url(#elao)"/>
  </g>
  <path d="M97 51.4 A3 3 0 0 1 99.4 50.4 L115 50.4" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.32"/>
  <circle cx="99.4" cy="52.2" r="0.9" fill="#ffffff" opacity="0.75"/>
