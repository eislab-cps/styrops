  <rect x="16" y="42" width="96" height="44" rx="6" fill="url(#elBox)"/>
  <g clip-path="url(#elclip)">
    <rect x="16" y="42" width="96" height="44" fill="url(#elsheen)"/>
    <ellipse cx="64" cy="86" rx="50" ry="9" fill="url(#elao)"/>
    <!-- shell seam -->
    <path d="M16 64.4 H112" stroke="#0b1118" stroke-width="0.7" opacity="0.5"/>
    <path d="M16 65.2 H112" stroke="#8fa8c4" stroke-width="0.5" opacity="0.11"/>
  </g>
  <!-- Top edge chrome -->
  <rect x="16" y="42" width="96" height="4.5" rx="3" fill="#5c7182" opacity="0.4"/>
  <path d="M16.5 48 A6 6 0 0 1 22.5 42.5 L104 42.5" fill="none" stroke="#a9c0d8" stroke-width="0.7" opacity="0.26"/>
  <path d="M111.5 74 L111.5 80 A6 6 0 0 1 105.5 85.5 L34 85.5" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <!-- Battery status indicator -->
  <ellipse cx="64" cy="63" rx="24" ry="3.4" fill="url(#elao)"/>
  <rect x="44" y="50" width="40" height="12" rx="3" fill="#131a24"/>
  <rect x="44" y="50" width="40" height="12" rx="3" fill="none" stroke="#060a10" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="62" cy="56" rx="20" ry="8" fill="url(#elgreen)"/>
  <rect x="46" y="52" width="6" height="8" rx="1" fill="#2f6323" opacity="0.95"/>
  <rect x="54" y="52" width="6" height="8" rx="1" fill="#2f6323" opacity="0.95"/>
  <rect x="62" y="52" width="6" height="8" rx="1" fill="#2a5a20" opacity="0.9"/>
  <rect x="70" y="52" width="6" height="8" rx="1" fill="#2a5a20" opacity="0.7"/>
  <rect x="78" y="52" width="4" height="8" rx="1" fill="#2a3a20" opacity="0.4"/>
  <path d="M45 51.2 H68 L58 55 H45Z" fill="#c6d7ea" opacity="0.09"/>
  <!-- Status LED -->
  <ellipse cx="64" cy="72" rx="8" ry="8" fill="url(#elglow)"/>
  <circle cx="64" cy="72" r="4" fill="#131a24"/>
  <circle cx="64" cy="72" r="2.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="63.2" cy="71.2" r="0.9" fill="#ffffff"/>
  <!-- Cable entry point -->
  <ellipse cx="64" cy="88.5" rx="8" ry="2.4" fill="url(#elao)"/>
  <rect x="58" y="82" width="12" height="6" rx="2" fill="#131a24"/>
  <rect x="60" y="84" width="8" height="3" rx="1" fill="#3b4c5c" opacity="0.8"/>
  <rect x="60" y="84" width="8" height="1" rx="0.5" fill="#c6d7ea" opacity="0.14"/>
  <!-- Mounting screws -->
  <circle cx="24" cy="44" r="2.5" fill="#131a24"/><circle cx="24" cy="44" r="1.5" fill="#3b4c5c"/><circle cx="24" cy="43.5" r="1.5" fill="#8fa8c4" opacity="0.2"/>
  <circle cx="104" cy="44" r="2.5" fill="#131a24"/><circle cx="104" cy="44" r="1.5" fill="#3b4c5c"/><circle cx="104" cy="43.5" r="1.5" fill="#8fa8c4" opacity="0.2"/>
</svg>
