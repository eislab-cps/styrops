  <ellipse cx="20" cy="66" rx="15" ry="3.4" fill="url(#elao)"/>
  <rect x="6" y="48" width="28" height="18" rx="5" fill="url(#elHead)"/>
  <path d="M6.5 53 A5 5 0 0 1 11.5 48.5 L30 48.5" fill="none" stroke="#a9c0d8" stroke-width="0.7" opacity="0.24"/>
  <path d="M33.5 60 A5 5 0 0 1 28.5 65.5 L12 65.5" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
