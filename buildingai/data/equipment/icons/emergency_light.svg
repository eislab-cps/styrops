<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="elBox" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#48596a"/>
      <stop offset="55%" stop-color="#2f3d4a"/>
      <stop offset="100%" stop-color="#1b242d"/>
    </linearGradient>
    <linearGradient id="elHead" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#3d4c5a"/>
      <stop offset="100%" stop-color="#1e2831"/>
    </linearGradient>
    <linearGradient id="elLens" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c7182" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#8199aa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4d6070" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="elao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="elglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="elgreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7de08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7de08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="elsheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="elclip"><rect x="16" y="42" width="96" height="44" rx="6"/></clipPath>
    <clipPath id="elclipL"><rect x="8" y="50" width="24" height="14" rx="3"/></clipPath>
    <clipPath id="elclipR"><rect x="96" y="50" width="24" height="14" rx="3"/></clipPath>
  </defs>
  <!-- Wall mount bracket bottom -->
  <rect x="36" y="84" width="56" height="6" rx="2" fill="#151c25"/>
  <rect x="36" y="84" width="56" height="1.6" rx="0.8" fill="#8fa8c4" opacity="0.1"/>
  <circle cx="50" cy="87" r="2" fill="#2a3845"/><circle cx="50" cy="86.4" r="2" fill="#8fa8c4" opacity="0.16"/>
  <circle cx="78" cy="87" r="2" fill="#2a3845"/><circle cx="78" cy="86.4" r="2" fill="#8fa8c4" opacity="0.16"/>
  <!-- Lamp beams (subtle) -->
  <path d="M6 52 L2 46 M6 57 L2 57 M6 62 L2 68" stroke="#ffffff" stroke-width="1" opacity="0.15" stroke-linecap="round"/>
  <path d="M122 52 L126 46 M122 57 L126 57 M122 62 L126 68" stroke="#ffffff" stroke-width="1" opacity="0.15" stroke-linecap="round"/>
