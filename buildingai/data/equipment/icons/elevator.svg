<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="elvShaft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26323d"/>
      <stop offset="100%" stop-color="#11161d"/>
    </linearGradient>
    <linearGradient id="elvDoor" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#4a5b68"/>
      <stop offset="55%" stop-color="#35444f"/>
      <stop offset="100%" stop-color="#232e37"/>
    </linearGradient>
    <linearGradient id="elvDoorR" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#3f4e5a"/>
      <stop offset="55%" stop-color="#2c3941"/>
      <stop offset="100%" stop-color="#1d262e"/>
    </linearGradient>
    <radialGradient id="elvao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="elvglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#88aacc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#88aacc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="elvsheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="elvclip"><rect x="8" y="8" width="112" height="120" rx="4"/></clipPath>
    <clipPath id="elvclipL"><rect x="18" y="36" width="46" height="88" rx="2"/></clipPath>
    <clipPath id="elvclipR"><rect x="64" y="36" width="46" height="88" rx="2"/></clipPath>
  </defs>
  <!-- Elevator shaft frame -->
  <rect x="8" y="8" width="112" height="120" rx="4" fill="url(#elvShaft)"/>
  <g clip-path="url(#elvclip)">
    <rect x="8" y="8" width="112" height="120" fill="url(#elvsheen)"/>
    <ellipse cx="64" cy="127" rx="58" ry="11" fill="url(#elvao)"/>
  </g>
  <!-- Shaft side rails -->
  <rect x="8" y="8" width="8" height="120" rx="2" fill="#1a2129"/>
  <rect x="8" y="8" width="3" height="120" fill="#c6d7ea" opacity="0.07"/>
  <rect x="112" y="8" width="8" height="120" rx="2" fill="#161c23"/>
  <rect x="112" y="8" width="2" height="120" fill="#04070c" opacity="0.4"/>
  <!-- Frame edge lighting -->
  <path d="M8.5 30 L8.5 12.5 A4 4 0 0 1 12.5 8.5 L106 8.5" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>
  <path d="M119.5 100 L119.5 123.5 A4 4 0 0 1 115.5 127.5 L30 127.5" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5" stroke-linecap="round"/>
  <!-- Floor indicator display (above doors) -->
  <ellipse cx="64" cy="33" rx="48" ry="4" fill="url(#elvao)"/>
  <rect x="16" y="10" width="96" height="22" rx="3" fill="#080e18"/>
  <rect x="16" y="10" width="96" height="22" rx="3" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.6"/>
  <ellipse cx="52" cy="21" rx="20" ry="11" fill="url(#elvglow)"/>
  <!-- Floor number display -->
  <text x="50" y="26" font-size="14" font-weight="bold" fill="#a6c4e2" opacity="0.95" font-family="monospace">03</text>
  <!-- Triangle up/down indicators -->
  <polygon points="84,14 90,14 87,11" fill="#a6c4e2" opacity="0.75"/>
  <polygon points="84,25 90,25 87,28" fill="#88aacc" opacity="0.28"/>
  <!-- Display glass reflection -->
  <path d="M17.5 11.5 H62 L38 30.5 H17.5Z" fill="#c6d7ea" opacity="0.055"/>
  <path d="M16.6 11 H110" stroke="#8fa8c4" stroke-width="0.6" opacity="0.22"/>
  <!-- Door frame -->
  <rect x="16" y="34" width="96" height="92" rx="2" fill="#151b23"/>
  <rect x="16" y="34" width="96" height="92" rx="2" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.55"/>
  <!-- Left door panel -->
  <rect x="18" y="36" width="46" height="88" rx="2" fill="url(#elvDoor)"/>
  <g clip-path="url(#elvclipL)">
    <rect x="18" y="36" width="46" height="88" fill="url(#elvsheen)"/>
    <ellipse cx="41" cy="125" rx="24" ry="7" fill="url(#elvao)"/>
    <!-- brushed metal -->
    <rect x="21" y="36" width="9" height="88" fill="#c6d7ea" opacity="0.06"/>
    <path d="M24.5 36 V124" stroke="#9fb4cc" stroke-width="0.4" opacity="0.1"/>
    <path d="M34.5 36 V124" stroke="#9fb4cc" stroke-width="0.4" opacity="0.1"/>
    <path d="M46.5 36 V124" stroke="#9fb4cc" stroke-width="0.4" opacity="0.1"/>
    <path d="M57.5 36 V124" stroke="#9fb4cc" stroke-width="0.4" opacity="0.1"/>
  </g>
  <!-- Left door panel line details -->
  <line x1="30" y1="36" x2="30" y2="124" stroke="#0d131a" stroke-width="0.6" opacity="0.6"/>
  <line x1="40" y1="36" x2="40" y2="124" stroke="#0d131a" stroke-width="0.6" opacity="0.5"/>
  <line x1="55" y1="36" x2="55" y2="124" stroke="#0d131a" stroke-width="0.6" opacity="0.4"/>
  <path d="M18.5 122 L18.5 37.5 L62 37.5" fill="none" stroke="#a9c0d8" stroke-width="0.7" opacity="0.2"/>
  <!-- Right door panel -->
  <rect x="64" y="36" width="46" height="88" rx="2" fill="url(#elvDoorR)"/>
  <g clip-path="url(#elvclipR)">
    <rect x="64" y="36" width="46" height="88" fill="url(#elvsheen)"/>
    <ellipse cx="87" cy="125" rx="24" ry="7" fill="url(#elvao)"/>
    <rect x="67" y="36" width="8" height="88" fill="#c6d7ea" opacity="0.05"/>
    <path d="M70.5 36 V124" stroke="#9fb4cc" stroke-width="0.4" opacity="0.1"/>
    <path d="M81.5 36 V124" stroke="#9fb4cc" stroke-width="0.4" opacity="0.1"/>
    <path d="M92.5 36 V124" stroke="#9fb4cc" stroke-width="0.4" opacity="0.1"/>
    <path d="M103.5 36 V124" stroke="#9fb4cc" stroke-width="0.4" opacity="0.1"/>
  </g>
  <!-- Right door panel lines -->
  <line x1="75" y1="36" x2="75" y2="124" stroke="#0d131a" stroke-width="0.6" opacity="0.4"/>
  <line x1="86" y1="36" x2="86" y2="124" stroke="#0d131a" stroke-width="0.6" opacity="0.5"/>
  <line x1="98" y1="36" x2="98" y2="124" stroke="#0d131a" stroke-width="0.6" opacity="0.6"/>
  <path d="M64.5 37.5 L109 37.5" fill="none" stroke="#a9c0d8" stroke-width="0.7" opacity="0.16"/>
  <path d="M109.5 40 L109.5 123.5" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.45"/>
  <!-- Door gap (center) -->
  <line x1="64" y1="36" x2="64" y2="124" stroke="#04070c" stroke-width="2.2"/>
  <line x1="65.4" y1="36" x2="65.4" y2="124" stroke="#8fa8c4" stroke-width="0.5" opacity="0.14"/>
  <!-- Door safety sensor LEDs -->
  <circle cx="62" cy="80" r="3" fill="#131a22"/>
  <ellipse cx="62" cy="80" rx="6" ry="6" fill="url(#elvglow)"/>
  <circle cx="62" cy="80" r="2" fill="#ffffff" opacity="0.65"/>
  <circle cx="66" cy="80" r="3" fill="#131a22"/>
  <circle cx="66" cy="80" r="2" fill="#ffffff" opacity="0.5"/>
  <!-- Call button panel (right side) -->
  <ellipse cx="114" cy="107" rx="9" ry="4" fill="url(#elvao)"/>
  <rect x="108" y="60" width="12" height="46" rx="3" fill="#1b232c"/>
  <rect x="108" y="60" width="12" height="46" rx="3" fill="url(#elvsheen)"/>
  <path d="M108.5 66 A3 3 0 0 1 111.5 60.5 L117 60.5" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.24"/>
  <path d="M119.5 96 L119.5 102.5 A3 3 0 0 1 116.5 105.5 L111 105.5" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <!-- Up button -->
  <circle cx="114" cy="72" r="5" fill="#2b3945" stroke="#5b7080" stroke-width="0.7"/>
  <path d="M110.4 69.2 A5 5 0 0 1 117.2 68.9" fill="none" stroke="#c6d7ea" stroke-width="0.8" opacity="0.28"/>
  <polygon points="114,68.6 117.6,74 110.4,74" fill="#a6c4e2" opacity="0.7"/>
  <!-- Down button -->
  <circle cx="114" cy="88" r="5" fill="#232f39" stroke="#4a5c6b" stroke-width="0.7"/>
  <path d="M110.4 85.2 A5 5 0 0 1 117.2 84.9" fill="none" stroke="#c6d7ea" stroke-width="0.8" opacity="0.2"/>
  <polygon points="110.4,85.2 117.6,85.2 114,90.6" fill="#88aacc" opacity="0.32"/>
  <!-- Door track grooves -->
  <line x1="16" y1="35.6" x2="112" y2="35.6" stroke="#c6d7ea" stroke-width="0.6" opacity="0.28"/>
  <line x1="16" y1="124.4" x2="112" y2="124.4" stroke="#04070c" stroke-width="0.9" opacity="0.5"/>
</svg>
