<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="vsCylinder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#313e4a"/>
      <stop offset="16%" stop-color="#7e93a7"/>
      <stop offset="30%" stop-color="#a9bccf"/>
      <stop offset="48%" stop-color="#435565"/>
      <stop offset="70%" stop-color="#1e2932"/>
      <stop offset="90%" stop-color="#5e7286"/>
      <stop offset="100%" stop-color="#26313c"/>
    </linearGradient>
    <linearGradient id="vsTop" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#5f7386"/>
      <stop offset="55%" stop-color="#3a4a58"/>
      <stop offset="100%" stop-color="#212c37"/>
    </linearGradient>
    <linearGradient id="vsFlange" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#455666"/>
      <stop offset="100%" stop-color="#1c2630"/>
    </linearGradient>
    <linearGradient id="vsStud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b3743"/>
      <stop offset="26%" stop-color="#7e93a7"/>
      <stop offset="50%" stop-color="#3a4a58"/>
      <stop offset="78%" stop-color="#161e26"/>
      <stop offset="100%" stop-color="#2b3743"/>
    </linearGradient>
    <radialGradient id="vsao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vssheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Vibration wave lines (behind) -->
  <path d="M28 55 Q24 60 28 65 Q32 70 28 75" fill="none" stroke="#88aacc" stroke-width="1.2" opacity="0.3" stroke-linecap="round"/>
  <path d="M20 52 Q14 60 20 68 Q24 74 20 80" fill="none" stroke="#88aacc" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
  <path d="M100 55 Q104 60 100 65 Q96 70 100 75" fill="none" stroke="#88aacc" stroke-width="1.2" opacity="0.3" stroke-linecap="round"/>
  <path d="M108 52 Q114 60 108 68 Q104 74 108 80" fill="none" stroke="#88aacc" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
  <!-- Mounting stud (threaded, at bottom) -->
  <rect x="58" y="96" width="12" height="26" rx="2" fill="url(#vsStud)"/>
  <g stroke="#0d131a" stroke-width="1" opacity="0.85">
    <line x1="58" y1="100" x2="70" y2="100"/>
    <line x1="58" y1="104" x2="70" y2="104"/>
    <line x1="58" y1="108" x2="70" y2="108"/>
    <line x1="58" y1="112" x2="70" y2="112"/>
    <line x1="58" y1="116" x2="70" y2="116"/>
  </g>
  <g stroke="#a8c2dc" stroke-width="0.5" opacity="0.2">
    <line x1="58" y1="101" x2="70" y2="101"/>
    <line x1="58" y1="105" x2="70" y2="105"/>
    <line x1="58" y1="109" x2="70" y2="109"/>
    <line x1="58" y1="113" x2="70" y2="113"/>
  </g>
  <!-- Hex nut -->
  <polygon points="64,114 72,118 72,126 64,130 56,126 56,118" fill="#212c36"/>
  <polygon points="64,115 71,119 71,125 64,129 57,125 57,119" fill="#3a4a58"/>
  <path d="M57 119 L64 115 L71 119" fill="none" stroke="#a8c2dc" stroke-width="0.8" opacity="0.3"/>
  <path d="M71 125 L64 129 L57 125" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <!-- Base flange / mounting pad -->
  <ellipse cx="64" cy="98" rx="28" ry="8" fill="url(#vsao)"/>
  <ellipse cx="64" cy="96" rx="28" ry="8" fill="url(#vsFlange)"/>
  <ellipse cx="64" cy="96.4" rx="20" ry="5.5" fill="#334455"/>
  <path d="M36 96 A28 8 0 0 1 64 88" fill="none" stroke="#8fa8c4" stroke-width="0.8" opacity="0.28"/>
  <path d="M92 96 A28 8 0 0 1 64 104" fill="none" stroke="#060a10" stroke-width="1" opacity="0.5"/>
  <!-- Main cylinder housing -->
  <rect x="40" y="28" width="48" height="70" rx="12" fill="url(#vsCylinder)"/>
  <rect x="42.4" y="32" width="1.8" height="62" rx="0.9" fill="#dcecff" opacity="0.3"/>
  <!-- Brushed streaks down the cylinder -->
  <g stroke="#9fb4cc" stroke-width="0.4" opacity="0.1">
    <line x1="48" y1="32" x2="48" y2="94"/>
    <line x1="53" y1="32" x2="53" y2="94"/>
    <line x1="70" y1="32" x2="70" y2="94"/>
    <line x1="76" y1="32" x2="76" y2="94"/>
  </g>
  <rect x="56" y="30" width="7" height="66" fill="#c6d7ea" opacity="0.06"/>
  <!-- Occlusion where the cylinder meets the flange -->
  <ellipse cx="64" cy="95" rx="26" ry="8" fill="url(#vsao)"/>
  <!-- Machined grooves on cylinder -->
  <g>
    <rect x="40" y="42" width="48" height="3" rx="1" fill="#0e141c" opacity="0.6"/>
    <rect x="40" y="45" width="48" height="0.8" fill="#a8c2dc" opacity="0.12"/>
    <rect x="40" y="50" width="48" height="3" rx="1" fill="#0e141c" opacity="0.6"/>
    <rect x="40" y="53" width="48" height="0.8" fill="#a8c2dc" opacity="0.12"/>
    <rect x="40" y="70" width="48" height="3" rx="1" fill="#0e141c" opacity="0.6"/>
    <rect x="40" y="73" width="48" height="0.8" fill="#a8c2dc" opacity="0.12"/>
    <rect x="40" y="78" width="48" height="3" rx="1" fill="#0e141c" opacity="0.6"/>
    <rect x="40" y="81" width="48" height="0.8" fill="#a8c2dc" opacity="0.12"/>
  </g>
  <!-- Status plate on cylinder -->
  <ellipse cx="64" cy="69" rx="20" ry="6" fill="url(#vsao)"/>
  <rect x="48" y="54" width="32" height="14" rx="3" fill="#131a24" opacity="0.85"/>
  <path d="M49 54.7 H79" fill="none" stroke="#8fa8c4" stroke-width="0.6" opacity="0.22"/>
  <rect x="50" y="56" width="20" height="3" rx="1" fill="#9dc0e2" opacity="0.42"/>
  <rect x="50" y="62" width="14" height="2" rx="1" fill="#9dc0e2" opacity="0.32"/>
  <!-- Occlusion under the top cap -->
  <ellipse cx="64" cy="34" rx="26" ry="8" fill="url(#vsao)"/>
  <!-- Top cap -->
  <ellipse cx="64" cy="28" rx="24" ry="10" fill="url(#vsTop)"/>
  <ellipse cx="64" cy="28" rx="24" ry="10" fill="url(#vssheen)"/>
  <ellipse cx="64" cy="27.4" rx="16" ry="6" fill="#4a6070" opacity="0.5"/>
  <path d="M40 28 A24 10 0 0 1 64 18" fill="none" stroke="#dcecff" stroke-width="1" opacity="0.4"/>
  <path d="M88 28 A24 10 0 0 1 64 38" fill="none" stroke="#060a10" stroke-width="1.1" opacity="0.5"/>
  <!-- Occlusion where the connector meets the cap -->
  <ellipse cx="64" cy="29" rx="13" ry="5" fill="url(#vsao)"/>
  <!-- Cable from top (behind connector) -->
  <path d="M64 14 Q64 6 54 4" fill="none" stroke="#10161e" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M64 14 Q64 6 54 4" fill="none" stroke="#3a4a58" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M63 13 Q63.2 6.6 55 3.2" fill="none" stroke="#a8c2dc" stroke-width="0.6" opacity="0.3" stroke-linecap="round"/>
  <!-- Cable connector at top -->
  <rect x="56" y="14" width="16" height="16" rx="4" fill="#2a3442"/>
  <rect x="56" y="14" width="16" height="8" rx="4" fill="#43566a" opacity="0.7"/>
  <path d="M57 15.4 A3 3 0 0 1 60 14 H68" fill="none" stroke="#a8c2dc" stroke-width="0.7" opacity="0.3"/>
  <path d="M72 26 A4 4 0 0 1 68 30 H60" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <circle cx="61" cy="20" r="2" fill="#121924"/><circle cx="61" cy="20" r="1.2" fill="#a8c2dc" opacity="0.55"/>
  <circle cx="67" cy="20" r="2" fill="#121924"/><circle cx="67" cy="20" r="1.2" fill="#a8c2dc" opacity="0.55"/>
</svg>
