  <circle cx="30" cy="70" r="4" fill="#111a24"/><circle cx="30" cy="70" r="2.5" fill="#e8f3ff" opacity="0.85"/><circle cx="29.3" cy="69.3" r="0.7" fill="#ffffff"/>
  <circle cx="44" cy="70" r="6" fill="#cfe6ff" opacity="0.06"/>
  <circle cx="44" cy="70" r="4" fill="#111a24"/><circle cx="44" cy="70" r="2.5" fill="#e8f3ff" opacity="0.6"/>
  <circle cx="58" cy="70" r="4" fill="#111a24"/><circle cx="58" cy="70" r="2.5" fill="#dbe8f5" opacity="0.4"/>
  <circle cx="72" cy="70" r="4" fill="#111a24"/><circle cx="72" cy="70" r="2.5" fill="#dbe8f5" opacity="0.3"/>
  <circle cx="86" cy="70" r="4" fill="#111a24"/><circle cx="86" cy="70" r="2.5" fill="#dbe8f5" opacity="0.3"/>
  <circle cx="100" cy="70" r="4" fill="#111a24"/><circle cx="100" cy="70" r="2.5" fill="#dbe8f5" opacity="0.4"/>
