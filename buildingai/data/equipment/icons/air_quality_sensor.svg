<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="aqsBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f414d"/>
      <stop offset="100%" stop-color="#18222c"/>
    </linearGradient>
    <linearGradient id="aqsPCB" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1a2820"/>
      <stop offset="100%" stop-color="#0c1510"/>
    </linearGradient>
    <radialGradient id="aqsao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aqssheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Housing body -->
