  <path d="M14.7 96 L14.7 18.7 A8 8 0 0 1 22.7 10.7 L96 10.7" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>
  <!-- Edge lighting: bottom + right -->
  <path d="M113.3 34 L113.3 109.3 A8 8 0 0 1 105.3 117.3 L38 117.3" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5" stroke-linecap="round"/>
