<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gldBody" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#4a4a34"/>
      <stop offset="55%" stop-color="#2e2e20"/>
      <stop offset="100%" stop-color="#1a1a11"/>
    </linearGradient>
    <radialGradient id="gldao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gldbead" cx="0.5" cy="0.5" r="0.5">
