<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="aedCase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f404c"/>
      <stop offset="100%" stop-color="#18222c"/>
    </linearGradient>
    <linearGradient id="aedGreen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#317036"/>
      <stop offset="100%" stop-color="#183c1e"/>
    </linearGradient>
    <radialGradient id="aedao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aedsheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Case body -->
  <rect x="10" y="14" width="108" height="100" rx="8" fill="url(#aedCase)"/>
  <rect x="10" y="14" width="108" height="100" rx="8" fill="url(#aedsheen)"/>
  <!-- Inside-bottom ambient occlusion -->
  <ellipse cx="64" cy="111" rx="52" ry="11" fill="url(#aedao)"/>
  <rect x="10" y="14" width="108" height="100" rx="8" fill="none" stroke="#3a5060" stroke-width="1.4" opacity="0.55"/>
  <!-- Green accent top stripe -->
  <rect x="10" y="14" width="108" height="10" rx="5" fill="url(#aedGreen)"/>
  <rect x="14" y="16" width="40" height="2.6" rx="1.3" fill="#ffffff" opacity="0.2"/>
  <!-- Shell seam under the stripe -->
  <line x1="13" y1="24.3" x2="115" y2="24.3" stroke="#050a10" stroke-width="0.6" opacity="0.5"/>
  <line x1="13" y1="25" x2="115" y2="25" stroke="#8fa8c4" stroke-width="0.5" opacity="0.13"/>
  <!-- Case latches (left side) -->
  <ellipse cx="17" cy="51" rx="9" ry="10" fill="url(#aedao)"/>
  <rect x="12" y="44" width="8" height="12" rx="3" fill="#18262e" stroke="#3b4d5e" stroke-width="0.8"/>
  <rect x="13" y="46" width="6" height="8" rx="2" fill="#2a3845"/>
  <rect x="13" y="46" width="6" height="3" rx="1.5" fill="#8fa8c4" opacity="0.14"/>
  <ellipse cx="17" cy="79" rx="9" ry="10" fill="url(#aedao)"/>
  <rect x="12" y="72" width="8" height="12" rx="3" fill="#18262e" stroke="#3b4d5e" stroke-width="0.8"/>
  <rect x="13" y="74" width="6" height="8" rx="2" fill="#2a3845"/>
  <rect x="13" y="74" width="6" height="3" rx="1.5" fill="#8fa8c4" opacity="0.14"/>
  <!-- Handle (top center) -->
  <ellipse cx="64" cy="21" rx="22" ry="7" fill="url(#aedao)"/>
  <rect x="46" y="16" width="36" height="8" rx="4" fill="#182030" stroke="#3b4d5e" stroke-width="1"/>
  <rect x="50" y="18" width="28" height="4" rx="2" fill="#2a3845"/>
  <rect x="50" y="18" width="28" height="1.6" rx="0.8" fill="#8fa8c4" opacity="0.16"/>
  <!-- AED label screen -->
  <ellipse cx="52.5" cy="40" rx="34" ry="13" fill="url(#aedao)"/>
  <rect x="20.5" y="28.5" width="63" height="21" rx="4" fill="#5f8fbf" opacity="0.07"/>
  <rect x="22" y="30" width="60" height="18" rx="3" fill="#0a1820"/>
  <rect x="22" y="30" width="60" height="18" rx="3" fill="none" stroke="#334455" stroke-width="0.7"/>
  <rect x="24" y="32" width="20" height="3" rx="1" fill="#88aacc" opacity="0.55"/>
  <rect x="24" y="38" width="30" height="2" rx="1" fill="#88aacc" opacity="0.32"/>
  <rect x="24" y="43" width="15" height="2" rx="1" fill="#ffffff" opacity="0.3"/>
  <!-- Screen glass reflection -->
  <path d="M23 47.5 L23 33 A3 3 0 0 1 26 30 L47 30 L27 47.5Z" fill="#c6d7ea" opacity="0.07"/>
  <!-- Heart + lightning symbol (main graphic) -->
  <ellipse cx="64.5" cy="74" rx="26" ry="21" fill="url(#aedao)"/>
  <path d="M64 90 Q44 76 44 62 A12 12 0 0 1 64 56 A12 12 0 0 1 84 62 Q84 76 64 90Z" fill="#b81c1c" opacity="0.85"/>
  <path d="M64 88 Q46 75 46 62 A10 10 0 0 1 64 58 A10 10 0 0 1 82 62 Q82 75 64 88Z" fill="#ee3030" opacity="0.6"/>
  <path d="M54 55.5 A10 10 0 0 1 62.6 58.4 Q55 62 51.5 71 Q48.5 64 54 55.5Z" fill="#ffffff" opacity="0.12"/>
  <!-- Lightning bolt on heart -->
  <path d="M68 60 L60 72 L65 72 L60 84 L72 68 L66 68Z" fill="#ffffff" opacity="0.92"/>
  <!-- Status LED -->
  <circle cx="104" cy="30" r="7.5" fill="#cfe6ff" opacity="0.1"/>
  <circle cx="104" cy="30" r="5" fill="#101821"/>
  <circle cx="104" cy="30" r="3.5" fill="#e8f3ff" opacity="0.8"/>
  <circle cx="104" cy="30" r="2" fill="#ffffff"/>
  <circle cx="103" cy="29" r="0.8" fill="#ffffff"/>
  <!-- Corner screws -->
  <circle cx="18" cy="22" r="3" fill="#141c26"/><circle cx="18" cy="22" r="2" fill="#3b4d5e"/><line x1="16" y1="22" x2="20" y2="22" stroke="#141c26" stroke-width="0.8"/><line x1="18" y1="20" x2="18" y2="24" stroke="#141c26" stroke-width="0.8"/>
  <circle cx="110" cy="22" r="3" fill="#141c26"/><circle cx="110" cy="22" r="2" fill="#3b4d5e"/>
  <circle cx="18" cy="106" r="3" fill="#141c26"/><circle cx="18" cy="106" r="2" fill="#3b4d5e"/>
  <circle cx="110" cy="106" r="3" fill="#141c26"/><circle cx="110" cy="106" r="2" fill="#3b4d5e"/>
  <!-- Bottom cable entry -->
  <ellipse cx="64" cy="113" rx="20" ry="6" fill="url(#aedao)"/>
  <rect x="50" y="110" width="28" height="6" rx="2" fill="#161e2a"/>
  <!-- Edge lighting: top + left -->
  <path d="M10.7 94 L10.7 22.7 A8 8 0 0 1 18.7 14.7 L98 14.7" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>
  <!-- Edge lighting: bottom + right -->
  <path d="M117.3 40 L117.3 105.3 A8 8 0 0 1 109.3 113.3 L36 113.3" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5" stroke-linecap="round"/>
</svg>
