<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- painted steel cylinder: dark left rim, specular band left of centre,
         core red, deep shadow right of centre, bounce light on the right rim -->
    <linearGradient id="feBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a0a0a"/>
      <stop offset="14%" stop-color="#7a1616"/>
      <stop offset="30%" stop-color="#9e2020"/>
      <stop offset="52%" stop-color="#761414"/>
      <stop offset="82%" stop-color="#2c0606"/>
      <stop offset="94%" stop-color="#571010"/>
      <stop offset="100%" stop-color="#3d0a0a"/>
    </linearGradient>
    <linearGradient id="feSpec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffe6e0" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="feBounce" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9a80" stop-opacity="0"/>
      <stop offset="60%" stop-color="#ff9a80" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ff9a80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="feShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="feGauge" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#31404f"/>
      <stop offset="100%" stop-color="#131a24"/>
    </radialGradient>
    <radialGradient id="feao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fesheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="feclip"><rect x="26" y="32" width="46" height="84" rx="12"/></clipPath>
  </defs>
  <!-- Wall bracket -->
  <rect x="8" y="30" width="12" height="60" rx="3" fill="#1b242c"/>
  <rect x="8" y="30" width="3.6" height="60" rx="1.8" fill="#c6d7ea" opacity="0.09"/>
  <rect x="8" y="36" width="12" height="6" rx="2" fill="#33424f"/>
  <rect x="8" y="36" width="12" height="1.8" rx="0.9" fill="#c6d7ea" opacity="0.16"/>
  <rect x="8" y="72" width="12" height="6" rx="2" fill="#2e3c48"/>
  <rect x="8" y="72" width="12" height="1.8" rx="0.9" fill="#c6d7ea" opacity="0.14"/>
  <circle cx="14" cy="32" r="3" fill="#141b23"/><circle cx="14" cy="32" r="2" fill="#2a3845"/><circle cx="14" cy="31.4" r="2" fill="#8fa8c4" opacity="0.18"/><circle cx="14" cy="32" r="0.8" fill="#88aacc" opacity="0.6"/>
  <circle cx="14" cy="86" r="3" fill="#141b23"/><circle cx="14" cy="86" r="2" fill="#2a3845"/><circle cx="14" cy="85.4" r="2" fill="#8fa8c4" opacity="0.18"/><circle cx="14" cy="86" r="0.8" fill="#88aacc" opacity="0.6"/>
  <!-- Hose -->
  <path d="M78 31 Q90 31 92 40 Q94 52 88 58" fill="none" stroke="#0f151d" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M78 31 Q90 31 92 40 Q94 52 88 58" fill="none" stroke="#31404f" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M79 29.8 Q89.6 29.8 91.2 38.6" fill="none" stroke="#c6d7ea" stroke-width="0.8" stroke-linecap="round" opacity="0.2"/>
  <!-- Nozzle -->
  <rect x="84" y="55" width="14" height="8" rx="3" fill="#28323f"/>
  <rect x="85" y="55.6" width="12" height="2.2" rx="1.1" fill="#c6d7ea" opacity="0.17"/>
  <path d="M98 57 L106 54 L106 62 L98 59Z" fill="#28323f"/>
  <path d="M98 57 L106 54 L106 55.6 L98 58.2Z" fill="#c6d7ea" opacity="0.14"/>
  <!-- Bottom base ring -->
  <ellipse cx="49" cy="116" rx="23" ry="5" fill="#242e3a"/>
  <ellipse cx="49" cy="115.4" rx="23" ry="5" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.2"/>
  <path d="M27.4 118.6 A23 5 0 0 0 70.6 118.6" fill="none" stroke="#04070c" stroke-width="1" opacity="0.5"/>
  <!-- Main cylinder body -->
  <rect x="26" y="32" width="46" height="84" rx="12" fill="url(#feBody)"/>
  <g clip-path="url(#feclip)">
    <!-- label band -->
    <rect x="26" y="60" width="46" height="28" fill="#cc2020" opacity="0.18"/>
    <rect x="26" y="60" width="46" height="1.4" fill="#ffd0c4" opacity="0.14"/>
    <rect x="30" y="64" width="38" height="2" rx="1" fill="#ffffff" opacity="0.18"/>
    <rect x="30" y="70" width="30" height="2" rx="1" fill="#ffffff" opacity="0.12"/>
    <!-- vertical form shading + crisp specular band -->
    <rect x="26" y="32" width="46" height="84" fill="url(#feShine)"/>
    <rect x="32" y="32" width="9" height="84" fill="url(#feSpec)"/>
    <rect x="35.4" y="34" width="2" height="80" fill="#fff2ee" opacity="0.2"/>
    <!-- bounce light off the right wall -->
    <rect x="60" y="32" width="12" height="84" fill="url(#feBounce)"/>
    <!-- top-left glaze + bedding shadows -->
    <rect x="26" y="32" width="46" height="84" fill="url(#fesheen)"/>
    <ellipse cx="49" cy="118" rx="26" ry="9" fill="url(#feao)"/>
    <ellipse cx="49" cy="30" rx="26" ry="7" fill="url(#feao)"/>
  </g>
  <!-- shoulder specular (top edge of the cylinder) -->
  <path d="M27.2 46 A12 12 0 0 1 38.6 32.7 L60 32.7" fill="none" stroke="#ffd6cc" stroke-width="0.9" opacity="0.3" stroke-linecap="round"/>
  <path d="M71.2 96 L71.2 104 A12 12 0 0 1 59.5 115.4 L44 115.4" fill="none" stroke="#04070c" stroke-width="1.1" opacity="0.5" stroke-linecap="round"/>
  <!-- Top valve assembly -->
  <ellipse cx="49" cy="35" rx="13" ry="3.2" fill="url(#feao)"/>
  <rect x="38" y="18" width="22" height="16" rx="4" fill="#242e3a"/>
  <rect x="38" y="18" width="22" height="7" rx="4" fill="#3a4a5a"/>
  <rect x="39" y="18.6" width="20" height="2" rx="1" fill="#cfe0f2" opacity="0.26"/>
  <path d="M59.5 30 A4 4 0 0 1 55.5 33.5 L44 33.5" fill="none" stroke="#04070c" stroke-width="0.9" opacity="0.5"/>
  <!-- Handle/lever -->
  <rect x="34" y="14" width="6" height="14" rx="2" fill="#3a4a55"/>
  <rect x="34" y="14" width="6" height="5" rx="2" fill="#516375"/>
  <rect x="34.4" y="14.4" width="1.8" height="13" rx="0.9" fill="#cfe0f2" opacity="0.24"/>
  <path d="M39.6 16 V27" stroke="#04070c" stroke-width="0.8" opacity="0.45"/>
  <!-- Safety pin -->
  <circle cx="37" cy="22" r="3" fill="#141b23" stroke="#a6c4e2" stroke-width="0.8"/>
  <line x1="37" y1="19" x2="37" y2="14" stroke="#a6c4e2" stroke-width="1"/>
  <!-- Hose connector -->
  <rect x="60" y="28" width="18" height="6" rx="2" fill="#28323f"/>
  <rect x="61" y="28.6" width="16" height="1.8" rx="0.9" fill="#c6d7ea" opacity="0.16"/>
  <!-- Pressure gauge -->
  <ellipse cx="76" cy="57" rx="12" ry="3.2" fill="url(#feao)"/>
  <circle cx="76" cy="44" r="12" fill="#28323f"/>
  <path d="M65.4 38.4 A12 12 0 0 1 83.6 35.6" fill="none" stroke="#c6d7ea" stroke-width="1" opacity="0.28"/>
  <path d="M87.4 49 A12 12 0 0 1 70 55.6" fill="none" stroke="#04070c" stroke-width="1.2" opacity="0.5"/>
  <circle cx="76" cy="44" r="10" fill="url(#feGauge)"/>
  <circle cx="76" cy="44" r="8" fill="none" stroke="#3d4c5a" stroke-width="0.5"/>
  <!-- Gauge arc (green zone) -->
  <path d="M68 44 A8 8 0 0 1 84 44" fill="none" stroke="#2f6323" stroke-width="2.5" opacity="0.75"/>
  <!-- Tick marks -->
  <line x1="76" y1="34" x2="76" y2="37" stroke="#7f95ab" stroke-width="1"/>
  <line x1="83" y1="40" x2="80.5" y2="41.5" stroke="#7f95ab" stroke-width="0.8"/>
  <line x1="69" y1="40" x2="71.5" y2="41.5" stroke="#7f95ab" stroke-width="0.8"/>
  <!-- Gauge glass reflection -->
  <path d="M67.6 40 A10 10 0 0 1 79.5 34.4 L69.5 46Z" fill="#ffffff" opacity="0.08"/>
  <!-- Gauge needle -->
  <line x1="76" y1="44" x2="78" y2="37" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <circle cx="76" cy="44" r="1.5" fill="#a6b8c8"/>
  <circle cx="75.5" cy="43.5" r="0.6" fill="#ffffff" opacity="0.7"/>
</svg>
