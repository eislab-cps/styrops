<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="escBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36434f"/>
      <stop offset="55%" stop-color="#212a33"/>
      <stop offset="100%" stop-color="#151b22"/>
    </linearGradient>
    <linearGradient id="escStep" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#4e5f70"/>
      <stop offset="55%" stop-color="#3a4a58"/>
      <stop offset="100%" stop-color="#26323d"/>
    </linearGradient>
    <linearGradient id="escRail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2d4e6"/>
      <stop offset="45%" stop-color="#8398ac"/>
      <stop offset="100%" stop-color="#41505e"/>
    </linearGradient>
    <radialGradient id="escao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="escglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#dceaff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#dceaff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="escsheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="escclip"><path d="M6 122 L6 88 L98 8 L122 8 L122 20 L16 20 L16 122Z"/></clipPath>
  </defs>
  <!-- Escalator side truss -->
  <path d="M6 122 L6 88 L98 8 L122 8 L122 20 L16 20 L16 122Z" fill="url(#escBody)" opacity="0.92"/>
  <g clip-path="url(#escclip)">
    <path d="M6 122 L6 88 L98 8 L122 8 L122 20 L16 20 L16 122Z" fill="url(#escsheen)"/>
    <!-- the truss interior is a recess: occlude it so the treads read on top -->
    <ellipse cx="50" cy="56" rx="48" ry="40" fill="url(#escao)"/>
    <ellipse cx="80" cy="34" rx="34" ry="24" fill="url(#escao)"/>
    <!-- inside-bottom AO -->
    <ellipse cx="12" cy="122" rx="12" ry="16" fill="url(#escao)"/>
    <!-- brushed metal along the incline -->
    <path d="M9 100 L104 17" stroke="#9fb4cc" stroke-width="0.4" opacity="0.1"/>
    <path d="M9 108 L112 18" stroke="#9fb4cc" stroke-width="0.4" opacity="0.1"/>
    <path d="M9 116 L120 19" stroke="#9fb4cc" stroke-width="0.4" opacity="0.1"/>
  </g>
  <!-- Truss edge lighting -->
  <path d="M6.5 120 L6.5 88.4 L97.6 8.5 L120 8.5" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>
  <path d="M121.5 10 L121.5 19.5 L16.5 19.5 L16.5 121" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5" stroke-linecap="round"/>
  <!-- Handrails -->
  <path d="M8 90 L100 10" stroke="#3d4c5a" stroke-width="5.4" stroke-linecap="round" opacity="0.55"/>
  <path d="M8 90 L100 10" stroke="url(#escRail)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M8.8 88.4 L99.4 9.2" stroke="#e2eefb" stroke-width="0.8" stroke-linecap="round" opacity="0.35"/>
  <path d="M18 90 L110 10" stroke="url(#escRail)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <!-- Steps -->
  <!-- Step 1 (bottom) -->
  <ellipse cx="22" cy="117" rx="16" ry="3.4" fill="url(#escao)"/>
  <rect x="8" y="106" width="28" height="10" rx="1" fill="url(#escStep)"/>
  <rect x="8" y="106" width="28" height="2.6" rx="1" fill="#cfe0f2" opacity="0.22"/>
  <path d="M8.4 116 L8.4 106.4 L35 106.4" fill="none" stroke="#a9c0d8" stroke-width="0.7" opacity="0.22"/>
  <path d="M35.6 108 L35.6 115.6 L12 115.6" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <rect x="36" y="96" width="4" height="10" rx="1" fill="#22303b"/>
  <rect x="36" y="96" width="1.4" height="10" rx="0.7" fill="#c6d7ea" opacity="0.13"/>
  <!-- Step 2 -->
  <ellipse cx="44" cy="99" rx="16" ry="3.4" fill="url(#escao)"/>
  <rect x="30" y="88" width="28" height="10" rx="1" fill="url(#escStep)"/>
  <rect x="30" y="88" width="28" height="2.6" rx="1" fill="#cfe0f2" opacity="0.22"/>
  <path d="M30.4 98 L30.4 88.4 L57 88.4" fill="none" stroke="#a9c0d8" stroke-width="0.7" opacity="0.22"/>
  <path d="M57.6 90 L57.6 97.6 L34 97.6" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <rect x="58" y="78" width="4" height="10" rx="1" fill="#22303b"/>
  <rect x="58" y="78" width="1.4" height="10" rx="0.7" fill="#c6d7ea" opacity="0.13"/>
  <!-- Step 3 -->
  <ellipse cx="66" cy="81" rx="16" ry="3.4" fill="url(#escao)"/>
  <rect x="52" y="70" width="28" height="10" rx="1" fill="url(#escStep)"/>
  <rect x="52" y="70" width="28" height="2.6" rx="1" fill="#cfe0f2" opacity="0.22"/>
  <path d="M52.4 80 L52.4 70.4 L79 70.4" fill="none" stroke="#a9c0d8" stroke-width="0.7" opacity="0.22"/>
  <path d="M79.6 72 L79.6 79.6 L56 79.6" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <rect x="80" y="60" width="4" height="10" rx="1" fill="#22303b"/>
  <rect x="80" y="60" width="1.4" height="10" rx="0.7" fill="#c6d7ea" opacity="0.13"/>
  <!-- Step 4 -->
  <ellipse cx="88" cy="63" rx="16" ry="3.4" fill="url(#escao)"/>
  <rect x="74" y="52" width="28" height="10" rx="1" fill="url(#escStep)"/>
  <rect x="74" y="52" width="28" height="2.6" rx="1" fill="#cfe0f2" opacity="0.22"/>
  <path d="M74.4 62 L74.4 52.4 L101 52.4" fill="none" stroke="#a9c0d8" stroke-width="0.7" opacity="0.22"/>
  <path d="M101.6 54 L101.6 61.6 L78 61.6" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <rect x="102" y="42" width="4" height="10" rx="1" fill="#22303b"/>
  <rect x="102" y="42" width="1.4" height="10" rx="0.7" fill="#c6d7ea" opacity="0.13"/>
  <!-- Step 5 (top) -->
  <ellipse cx="107" cy="45" rx="13" ry="3.2" fill="url(#escao)"/>
  <rect x="96" y="34" width="22" height="10" rx="1" fill="url(#escStep)"/>
  <rect x="96" y="34" width="22" height="2.6" rx="1" fill="#cfe0f2" opacity="0.22"/>
  <path d="M96.4 44 L96.4 34.4 L117 34.4" fill="none" stroke="#a9c0d8" stroke-width="0.7" opacity="0.22"/>
  <path d="M117.6 36 L117.6 43.6 L100 43.6" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <!-- Step tread grooves -->
  <line x1="10" y1="109.4" x2="34" y2="109.4" stroke="#1b242d" stroke-width="0.8" opacity="0.75"/>
  <line x1="10" y1="112.4" x2="34" y2="112.4" stroke="#1b242d" stroke-width="0.8" opacity="0.75"/>
  <line x1="32" y1="91.4" x2="56" y2="91.4" stroke="#1b242d" stroke-width="0.8" opacity="0.75"/>
  <line x1="32" y1="94.4" x2="56" y2="94.4" stroke="#1b242d" stroke-width="0.8" opacity="0.75"/>
  <line x1="54" y1="73.4" x2="78" y2="73.4" stroke="#1b242d" stroke-width="0.8" opacity="0.75"/>
  <line x1="54" y1="76.4" x2="78" y2="76.4" stroke="#1b242d" stroke-width="0.8" opacity="0.75"/>
  <line x1="76" y1="55.4" x2="100" y2="55.4" stroke="#1b242d" stroke-width="0.8" opacity="0.75"/>
  <line x1="76" y1="58.4" x2="100" y2="58.4" stroke="#1b242d" stroke-width="0.8" opacity="0.75"/>
  <line x1="98" y1="37.4" x2="116" y2="37.4" stroke="#1b242d" stroke-width="0.8" opacity="0.75"/>
  <line x1="98" y1="40.4" x2="116" y2="40.4" stroke="#1b242d" stroke-width="0.8" opacity="0.75"/>
  <!-- Comb plate top -->
  <rect x="96" y="34" width="24" height="4" rx="1" fill="#2c3a47"/>
  <rect x="96" y="34" width="24" height="1.2" rx="0.6" fill="#c6d7ea" opacity="0.16"/>
  <!-- Motor housing (bottom) -->
  <ellipse cx="13" cy="123" rx="10" ry="3" fill="url(#escao)"/>
  <rect x="6" y="108" width="14" height="14" rx="3" fill="#252f3c"/>
  <rect x="6" y="108" width="14" height="14" rx="3" fill="url(#escsheen)"/>
  <path d="M6.5 111 A3 3 0 0 1 9.5 108.5 L17 108.5" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.24"/>
  <path d="M19.5 116 L19.5 119 A3 3 0 0 1 16.5 121.5 L10 121.5" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <!-- Comb plate bottom -->
  <rect x="6" y="118" width="28" height="4" rx="1" fill="#2c3a47"/>
  <rect x="6" y="118" width="28" height="1.2" rx="0.6" fill="#c6d7ea" opacity="0.16"/>
  <line x1="8" y1="118" x2="8" y2="122" stroke="#141b23" stroke-width="1.2"/>
  <line x1="12" y1="118" x2="12" y2="122" stroke="#141b23" stroke-width="1.2"/>
  <line x1="16" y1="118" x2="16" y2="122" stroke="#141b23" stroke-width="1.2"/>
  <line x1="20" y1="118" x2="20" y2="122" stroke="#141b23" stroke-width="1.2"/>
  <line x1="24" y1="118" x2="24" y2="122" stroke="#141b23" stroke-width="1.2"/>
  <line x1="28" y1="118" x2="28" y2="122" stroke="#141b23" stroke-width="1.2"/>
  <!-- Status light -->
  <ellipse cx="114" cy="14" rx="9" ry="9" fill="url(#escglow)"/>
  <circle cx="114" cy="14" r="4" fill="#141b23"/>
  <circle cx="114" cy="14" r="2.5" fill="#ffffff" opacity="0.75"/>
  <circle cx="113.2" cy="13.2" r="0.9" fill="#ffffff"/>
</svg>
