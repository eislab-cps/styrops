<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="wapDome" cx="35%" cy="27%" r="84%">
      <stop offset="0%" stop-color="#5a6d80"/>
      <stop offset="42%" stop-color="#374754"/>
      <stop offset="100%" stop-color="#161f28"/>
    </radialGradient>
    <radialGradient id="wapForm" cx="37%" cy="29%" r="74%">
      <stop offset="50%" stop-color="#04070c" stop-opacity="0"/>
      <stop offset="80%" stop-color="#04070c" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0.58"/>
    </radialGradient>
    <radialGradient id="wapLED" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#88aacc" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="wapao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wapsheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wapPlate" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#2b3844"/>
      <stop offset="100%" stop-color="#171f28"/>
    </linearGradient>
    <radialGradient id="wapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8ccf0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a8ccf0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Signal arc waves (behind the unit) -->
  <path d="M46 40 Q64 28 82 40" fill="none" stroke="#88aacc" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
  <path d="M36 34 Q64 18 92 34" fill="none" stroke="#88aacc" stroke-width="1.2" opacity="0.25" stroke-linecap="round"/>
  <path d="M26 28 Q64 8 102 28" fill="none" stroke="#88aacc" stroke-width="1" opacity="0.15" stroke-linecap="round"/>
  <!-- Ceiling mount plate -->
  <ellipse cx="64" cy="28" rx="50" ry="12" fill="url(#wapPlate)"/>
  <ellipse cx="64" cy="26" rx="38" ry="7" fill="#2a3845" opacity="0.4"/>
  <path d="M14 28 A50 12 0 0 1 64 16" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.22"/>
  <path d="M114 28 A50 12 0 0 1 64 40" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <!-- Mount screw pattern -->
  <circle cx="38" cy="28" r="4" fill="#141b24"/><circle cx="38" cy="28" r="2.5" fill="#334455"/><circle cx="37.2" cy="27.2" r="0.9" fill="#a8c2dc" opacity="0.45"/>
  <circle cx="90" cy="28" r="4" fill="#141b24"/><circle cx="90" cy="28" r="2.5" fill="#334455"/><circle cx="89.2" cy="27.2" r="0.9" fill="#a8c2dc" opacity="0.45"/>
  <circle cx="64" cy="20" r="4" fill="#141b24"/><circle cx="64" cy="20" r="2.5" fill="#334455"/><circle cx="63.2" cy="19.2" r="0.9" fill="#a8c2dc" opacity="0.45"/>
  <!-- Connecting stem -->
  <rect x="58" y="26" width="12" height="20" rx="3" fill="#27343f"/>
  <rect x="58" y="26" width="4" height="20" rx="2" fill="#8fa8c4" opacity="0.13"/>
  <!-- AP body (dome / puck) -->
  <ellipse cx="64" cy="72" rx="52" ry="38" fill="url(#wapDome)"/>
  <ellipse cx="64" cy="72" rx="52" ry="38" fill="url(#wapForm)"/>
  <!-- Top-left dome sheen -->
  <ellipse cx="46" cy="57" rx="32" ry="17" fill="url(#wapsheen)" transform="rotate(-20 46 57)"/>
  <!-- Rim light / rim shade -->
  <path d="M12 72 A52 38 0 0 1 64 34" fill="none" stroke="#a8c2dc" stroke-width="1.1" opacity="0.3"/>
  <path d="M116 72 A52 38 0 0 1 64 110" fill="none" stroke="#060a10" stroke-width="1.3" opacity="0.5"/>
  <path d="M22 92 A52 38 0 0 0 64 110" fill="none" stroke="#060a10" stroke-width="1" opacity="0.3"/>
  <!-- Radome concentric rings -->
  <ellipse cx="64" cy="72" rx="42" ry="30" fill="none" stroke="#3d4d5c" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="64" cy="72" rx="42" ry="30" fill="none" stroke="#0b111a" stroke-width="0.8" opacity="0.35" transform="translate(0.8 0.9)"/>
  <ellipse cx="64" cy="72" rx="32" ry="22" fill="none" stroke="#3d4d5c" stroke-width="0.8" opacity="0.42"/>
  <ellipse cx="64" cy="72" rx="22" ry="15" fill="none" stroke="#3d4d5c" stroke-width="0.8" opacity="0.34"/>
  <!-- LED ring bedded into the radome -->
  <ellipse cx="65" cy="73" rx="24" ry="18" fill="url(#wapao)"/>
  <ellipse cx="64" cy="72" rx="13" ry="9" fill="#141b26"/>
  <ellipse cx="64" cy="72" rx="13" ry="9" fill="none" stroke="#060a10" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="64" cy="72" rx="18" ry="13" fill="url(#wapGlow)"/>
  <circle cx="54" cy="72" r="3" fill="url(#wapLED)"/>
  <circle cx="60" cy="70" r="3" fill="url(#wapLED)" opacity="0.8"/>
  <circle cx="67" cy="70" r="3" fill="url(#wapLED)" opacity="0.7"/>
  <circle cx="73" cy="72" r="3" fill="url(#wapLED)" opacity="0.6"/>
  <circle cx="68" cy="75" r="3" fill="url(#wapLED)" opacity="0.5"/>
  <circle cx="61" cy="75" r="3" fill="url(#wapLED)" opacity="0.6"/>
  <!-- Vent slots on AP side -->
  <line x1="14" y1="68" x2="20" y2="68" stroke="#10161e" stroke-width="2" opacity="0.8"/>
  <line x1="14" y1="73" x2="20" y2="73" stroke="#10161e" stroke-width="2" opacity="0.8"/>
  <line x1="108" y1="68" x2="114" y2="68" stroke="#10161e" stroke-width="2" opacity="0.8"/>
  <line x1="108" y1="73" x2="114" y2="73" stroke="#10161e" stroke-width="2" opacity="0.8"/>
</svg>
