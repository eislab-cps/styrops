<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="rdBody" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#37414f"/>
      <stop offset="55%" stop-color="#242c39"/>
      <stop offset="100%" stop-color="#161b24"/>
    </linearGradient>
    <linearGradient id="rdStand" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#2c3543"/>
      <stop offset="100%" stop-color="#141a23"/>
    </linearGradient>
    <linearGradient id="rdScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a22"/>
      <stop offset="100%" stop-color="#050d12"/>
    </linearGradient>
    <linearGradient id="rdBloom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb6e6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7fb6e6" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="rdao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#04070c" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#04070c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rdsheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#c6d7ea" stop-opacity="0.17"/>
      <stop offset="45%" stop-color="#c6d7ea" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6d7ea" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Stand -->
  <ellipse cx="64" cy="93" rx="26" ry="5" fill="url(#rdao)"/>
  <rect x="44" y="90" width="40" height="11" rx="3" fill="url(#rdStand)"/>
  <path d="M45 90.7 L83 90.7" stroke="#8fa8c4" stroke-width="0.6" opacity="0.16"/>
  <path d="M46 100.4 L82 100.4" stroke="#060a10" stroke-width="0.9" opacity="0.5"/>
  <ellipse cx="64" cy="110" rx="34" ry="6" fill="url(#rdao)"/>
  <ellipse cx="64" cy="109.5" rx="22" ry="2.6" fill="#04070c" opacity="0.4"/>
  <rect x="36" y="100" width="56" height="9" rx="3" fill="url(#rdStand)"/>
  <rect x="36" y="100" width="56" height="9" rx="3" fill="url(#rdsheen)"/>
  <path d="M36.6 105 L36.6 102.6 Q36.6 100.6 38.6 100.6 L89 100.6" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>
  <path d="M91.4 104 L91.4 106.4 Q91.4 108.4 89.4 108.4 L42 108.4" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5" stroke-linecap="round"/>

  <!-- Monitor body -->
  <rect x="12" y="14" width="104" height="80" rx="8" fill="url(#rdBody)"/>
  <rect x="12" y="14" width="104" height="80" rx="8" fill="url(#rdsheen)"/>
  <ellipse cx="64" cy="92" rx="50" ry="8" fill="url(#rdao)"/>
  <path d="M12.6 80 L12.6 20.6 Q12.6 14.6 18.6 14.6 L108 14.6" fill="none" stroke="#8fa8c4" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>
  <path d="M115.4 28 L115.4 87.4 Q115.4 93.4 109.4 93.4 L26 93.4" fill="none" stroke="#060a10" stroke-width="0.9" opacity="0.5" stroke-linecap="round"/>
  <!-- shell seam -->
  <path d="M13 81 L115 81" stroke="#060a10" stroke-width="0.7" opacity="0.36"/>
  <path d="M13 81.9 L115 81.9" stroke="#8fa8c4" stroke-width="0.5" opacity="0.1"/>

  <!-- Display -->
  <ellipse cx="64" cy="79" rx="48" ry="5" fill="url(#rdao)"/>
  <rect x="18" y="26" width="92" height="52" rx="4" fill="url(#rdScreen)"/>
  <path d="M20 26.9 L108 26.9" stroke="#04070c" stroke-width="1.3" opacity="0.7"/>
  <path d="M18.7 28 L18.7 76" stroke="#04070c" stroke-width="1" opacity="0.55"/>
  <path d="M20 77.2 L108 77.2" stroke="#8fa8c4" stroke-width="0.8" opacity="0.16"/>
  <path d="M109.3 30 L109.3 76" stroke="#8fa8c4" stroke-width="0.6" opacity="0.11"/>
  <rect x="18.8" y="26.8" width="90.4" height="50.4" rx="3.2" fill="url(#rdBloom)" opacity="0.6"/>

  <!-- Readout -->
  <text x="22" y="56" font-size="28" font-weight="bold" fill="#9fc2e6" opacity="0.95" font-family="monospace">Rn</text>
  <text x="62" y="50" font-size="14" fill="#ffffff" opacity="0.85" font-family="monospace">24</text>
  <text x="62" y="62" font-size="7" fill="#6d849c" font-family="monospace">Bq/m³</text>

  <!-- Radiation trefoil -->
  <circle cx="96" cy="40" r="12.5" fill="#2b1a15"/>
  <path d="M85.6 33.1 A12.5 12.5 0 0 1 96 27.5" fill="none" stroke="#d8a44a" stroke-width="0.9" opacity="0.4"/>
  <path d="M106.4 46.9 A12.5 12.5 0 0 1 96 52.5" fill="none" stroke="#04070c" stroke-width="1" opacity="0.55"/>
  <g fill="#d99a1c" opacity="0.85">
    <path d="M90.8 30.9 A10.5 10.5 0 0 1 101.2 30.9 L97.6 37.2 A3.2 3.2 0 0 0 94.4 37.2 Z"/>
    <path d="M106.5 40 A10.5 10.5 0 0 1 101.3 49.1 L97.6 42.8 A3.2 3.2 0 0 0 99.2 40 Z"/>
    <path d="M90.7 49.1 A10.5 10.5 0 0 1 85.5 40 L92.8 40 A3.2 3.2 0 0 0 94.4 42.8 Z"/>
  </g>
  <circle cx="96" cy="40" r="3.2" fill="#2b1a15"/>
  <circle cx="94.8" cy="38.8" r="1" fill="#f0c877" opacity="0.35"/>

  <!-- Trend bar -->
  <rect x="22" y="68" width="70" height="6" rx="2" fill="#0c141c"/>
  <path d="M23 68.6 L91 68.6" stroke="#04070c" stroke-width="0.8" opacity="0.6"/>
  <rect x="22" y="68" width="40" height="6" rx="2" fill="#2f7a3f" opacity="0.85"/>
  <rect x="22.6" y="68.7" width="38.8" height="1.6" rx="0.8" fill="#a8e6ba" opacity="0.28"/>
  <path d="M23 73.4 L91 73.4" stroke="#8fa8c4" stroke-width="0.6" opacity="0.14"/>

  <!-- Housing LEDs -->
  <circle cx="24" cy="20" r="3" fill="#0a1017"/><circle cx="24" cy="20" r="1.9" fill="#e8f2ff" opacity="0.75"/><circle cx="23.4" cy="19.4" r="0.7" fill="#ffffff" opacity="0.9"/>
  <circle cx="32" cy="20" r="3" fill="#0a1017"/><circle cx="32" cy="20" r="1.9" fill="#e8f2ff" opacity="0.4"/>

  <!-- Buttons -->
  <ellipse cx="25" cy="90" rx="7" ry="2.6" fill="url(#rdao)"/>
  <ellipse cx="37" cy="90" rx="7" ry="2.6" fill="url(#rdao)"/>
  <ellipse cx="49" cy="90" rx="7" ry="2.6" fill="url(#rdao)"/>
  <g fill="#33434f">
    <rect x="20" y="84" width="10" height="6" rx="2"/>
    <rect x="32" y="84" width="10" height="6" rx="2"/>
    <rect x="44" y="84" width="10" height="6" rx="2"/>
  </g>
  <g stroke="#b6cbe2" stroke-width="0.6" opacity="0.22">
    <path d="M21 84.7 L29 84.7"/><path d="M33 84.7 L41 84.7"/><path d="M45 84.7 L53 84.7"/>
  </g>

  <!-- Air intake vents -->
  <ellipse cx="84" cy="91" rx="24" ry="3.5" fill="url(#rdao)"/>
  <rect x="62" y="83" width="44" height="8" rx="2" fill="#0d141c"/>
  <path d="M63 83.7 L105 83.7" stroke="#04070c" stroke-width="1" opacity="0.65"/>
  <g stroke="#37485a" stroke-width="1.3" opacity="0.8">
    <path d="M64 85.6 L104 85.6"/><path d="M64 88.4 L104 88.4"/>
  </g>
  <path d="M63 90.3 L105 90.3" stroke="#8fa8c4" stroke-width="0.6" opacity="0.16"/>
</svg>
